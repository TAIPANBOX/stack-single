<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 996 396" width="996" height="396" role="img" aria-label="stack-single puts the whole governed stack on one box you own, for agents that live somewhere else. It comes up closed: the gateway is published to the host's loopback, and opening it to your agents is one deliberate word. Two directions cross the boundary and they are not the same: an operator comes IN through a tunnel the box issues their device, and the notifier dials OUT to a mail server on its own">
  <title>stack-single: one box, closed by default, and two directions that are easy to confuse</title>
  <rect x="-18" y="-18" width="996" height="396" rx="16" fill="#0A0E13"/>
  <rect x="-17.5" y="-17.5" width="995" height="395" rx="15.5" fill="none" stroke="rgba(255,255,255,.09)"/>

  <defs>
    <marker id="ss-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#5A6675"/>
    </marker>
    <marker id="ss-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#4493F8"/>
    </marker>
    <marker id="ss-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#3FB950"/>
    </marker>
  </defs>

  <g font-family="ui-monospace,Menlo" text-anchor="middle">

    <text x="480" y="24" fill="#E9EFF6" font-size="13" font-weight="700">one box you own, and it comes up closed</text>
    <text x="480" y="41" fill="#5A6675" font-size="10">a box that just ran an install script does not acquire an internet-facing enforcement plane because nobody typed anything</text>

    <!-- the box -->
    <rect x="286" y="56" width="388" height="266" rx="13" fill="none" stroke="#4493F8" stroke-dasharray="6 4" stroke-width="1.3">
      <animate attributeName="stroke-opacity" values="1;.45;1" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <text x="480" y="76" fill="#4493F8" font-size="10.5" font-weight="700">the box, and here the boundary IS the machine</text>

    <rect x="302" y="88" width="356" height="52" rx="9" fill="#141C27" stroke="#2a3547"/>
    <text x="480" y="107" fill="#E9EFF6" font-size="10.5" font-weight="700">the planes this box runs, as compose services</text>
    <text x="480" y="123" fill="#8A97A6" font-size="9.5">money (gateway and cloud), policy, identity, the console</text>
    <text x="480" y="135" fill="#8A97A6" font-size="9.5">plus heraldyx, running from the first minute</text>

    <rect x="302" y="150" width="356" height="46" rx="9" fill="#141C27" stroke="#E3B341"/>
    <text x="480" y="169" fill="#E3B341" font-size="10.5" font-weight="700">the gateway is published to LOOPBACK</text>
    <text x="480" y="185" fill="#8A97A6" font-size="9.5">opening it to the agents you actually have is one word</text>

    <rect x="302" y="206" width="356" height="46" rx="9" fill="#141C27" stroke="#2a3547"/>
    <text x="480" y="225" fill="#E9EFF6" font-size="10.5" font-weight="700">the installer sends one test mail</text>
    <text x="480" y="241" fill="#8A97A6" font-size="9.5">while you are still at the keyboard, not a week later</text>

    <rect x="302" y="262" width="356" height="46" rx="9" fill="#10161F" stroke="#2a3547"/>
    <text x="480" y="281" fill="#8A97A6" font-size="9.5">the agents this governs live somewhere else entirely:</text>
    <text x="480" y="296" fill="#8A97A6" font-size="9.5">the box they are pointed at, not the box they run on</text>

    <!-- coming IN -->
    <rect x="8" y="86" width="250" height="112" rx="12" fill="#10161F" stroke="#4493F8"/>
    <text x="133" y="107" fill="#4493F8" font-size="10.5" font-weight="700">you, coming IN</text>
    <text x="133" y="126" fill="#8A97A6" font-size="9.5">the box issues your device its</text>
    <text x="133" y="140" fill="#8A97A6" font-size="9.5">own tunnel, so the console has</text>
    <text x="133" y="154" fill="#8A97A6" font-size="9.5">no public door to knock on</text>
    <text x="133" y="175" fill="#8A97A6" font-size="9.5">a name and a passkey work</text>
    <text x="133" y="189" fill="#8A97A6" font-size="9.5">because the name is yours</text>

    <path d="M262 142 L282 142" stroke="#4493F8" stroke-width="1.3" marker-end="url(#ss-b)" fill="none"/>
    <circle cx="264" cy="142" r="2.6" fill="#4493F8">
      <animate attributeName="cx" values="264;280" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <!-- going OUT -->
    <path d="M678 228 L698 228" stroke="#3FB950" stroke-width="1.3" marker-end="url(#ss-g)" fill="none"/>
    <circle cx="680" cy="228" r="2.6" fill="#3FB950">
      <animate attributeName="cx" values="680;696" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <rect x="702" y="172" width="250" height="112" rx="12" fill="#10161F" stroke="#3FB950"/>
    <text x="827" y="193" fill="#3FB950" font-size="10.5" font-weight="700">the notifier, dialling OUT</text>
    <text x="827" y="212" fill="#8A97A6" font-size="9.5">heraldyx reaches your mail</text>
    <text x="827" y="226" fill="#8A97A6" font-size="9.5">server by itself, and needs</text>
    <text x="827" y="240" fill="#8A97A6" font-size="9.5">none of the tunnel to do it</text>
    <text x="827" y="261" fill="#8A97A6" font-size="9.5">own or corporate SMTP costs</text>
    <text x="827" y="275" fill="#8A97A6" font-size="9.5">nothing; hosted ones meter</text>

    <!-- the confusion worth naming -->
    <rect x="8" y="222" width="250" height="86" rx="12" fill="#141C27" stroke="#F0544C"/>
    <text x="133" y="242" fill="#F0544C" font-size="10" font-weight="700">two directions, not one</text>
    <text x="133" y="260" fill="#8A97A6" font-size="9">Confusing them is not theoretical: a</text>
    <text x="133" y="273" fill="#8A97A6" font-size="9">live run put the tunnel's private name</text>
    <text x="133" y="286" fill="#8A97A6" font-size="9">into the mail, so the link was dead for</text>
    <text x="133" y="299" fill="#8A97A6" font-size="9">an operator who came in another way.</text>

    <text x="860" y="348" fill="#5A6675" font-size="9.5">github.com/TAIPANBOX/stack-single</text>
    <text x="230" y="348" fill="#5A6675" font-size="9.5">the same stack, three shapes: your machine, one box, a cluster</text>
  </g>
</svg>
