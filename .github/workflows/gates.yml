# The gates in scripts/ used to run only through .githooks/pre-push. That is a
# LOCAL configuration: `core.hooksPath` is not committed and does not travel
# with a clone, so those checks enforced nothing for anybody who cloned this
# repo. A gate that runs on one machine is a comment with an exit code.
#
# This workflow calls the same scripts the hook calls. One copy of each check,
# two callers. Public repo, so standard runners cost nothing.
name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install.sh lints clean
        run: ./scripts/shell-lint.sh

      - name: the stack comes up closed
        run: ./scripts/closed-by-default.sh

      - name: it fails before doing half the job
        run: ./scripts/fail-before-half-the-job.sh
      - name: every image has the files it copies
        run: ./scripts/build-context-complete.sh

      - name: components.json says what this launcher actually installs
        run: ./scripts/manifest-is-true.sh
      - name: the record plane reads the bus and writes somewhere else
        run: ./scripts/record-is-not-on-the-bus.sh

      # Last, because it mutates tracked files and restores them. It needs a
      # clean tree and says so plainly, so it also reports any earlier step
      # that starts writing into the checkout. Two of its cases mutate a copy
      # of the stack-k8s tree, which it fetches the same way the gate above
      # does when there is no sibling checkout.
      - name: the gates above can still fail
        run: ./scripts/gates-have-teeth.sh
