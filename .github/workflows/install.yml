# Runs install.sh for real, twice, on a fresh Ubuntu runner.
#
# Every gate in scripts/ reads files. None of them ran the installer, and from
# v1.1.9 to v1.1.12 every install stopped at `. ./.env` with exit 127 (an
# unquoted `|` in a default) while every gate stayed green: nothing had run
# install.sh on a real box since the line went in. This job is that run. The
# second pass is the re-run an operator does after an upgrade, which is where
# the installer's own second-run faults have shown up before.
#
# Each leg ends by reading the stack it installed with `install.sh status`, and
# checks that the read changed nothing (containers, start times, .env).
# Public repo, so standard runners cost nothing.
name: install

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [default, delegation, typed-risk, identity, openai-door, static-only]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The identity leg hands install.sh a keys file and an identity map, the
      # way an onboarding agent would. Fresh secrets per run, never printed.
      - name: identity inputs
        if: matrix.profile == 'identity'
        run: |
          d="$RUNNER_TEMP/identity"
          mkdir -p "$d"
          umask 077
          printf '# CI keys, %s\n%s:treasury-bots\n%s:research-bots\n' "$(date -u +%F)" \
            "ci-$(openssl rand -hex 20)" "ci-$(openssl rand -hex 20)" >"$d/keys.txt"
          cat >"$d/identity.json" <<'JSON'
          {
            "units": [
              {"id": "treasury", "owner": "user://ci.invalid/treasury", "budget_usd_month": 20},
              {"id": "research", "budget_usd_month": 5}
            ],
            "keys": [
              {"key_id": "treasury-bots", "unit": "treasury", "agents": ["agent://ci.invalid/treasury/*"]},
              {"key_id": "research-bots", "unit": "research", "agents": ["agent://ci.invalid/research/*"]}
            ]
          }
          JSON
          echo "IDENTITY_IN=$d" >>"$GITHUB_ENV"

      # The OpenAI door's leg (CLAUDE.md invariant 32): its own keys file and map,
      # and a stub on the runner that answers the OpenAI wire and writes down the
      # Authorization each call brought, so the door's forwarding is seen rather
      # than assumed. Fresh secrets per run, never printed. No provider is called.
      - name: openai door inputs and a stub upstream
        if: matrix.profile == 'openai-door'
        run: |
          d="$RUNNER_TEMP/door"
          mkdir -p "$d"
          umask 077
          printf '%s:flint\n%s:brume\n' "ci-$(openssl rand -hex 20)" "ci-$(openssl rand -hex 20)" >"$d/keys.txt"
          cat >"$d/identity.json" <<'JSON'
          {
            "units": [{"id": "routers", "budget_usd_month": 3}],
            "keys": [
              {"key_id": "flint", "unit": "routers", "agents": ["agent://ci.invalid/flint/*"]},
              {"key_id": "brume", "unit": "routers", "agents": ["agent://ci.invalid/brume/*"]}
            ]
          }
          JSON
          cat >"$d/stub.py" <<'PY'
          import json
          import sys
          from http.server import BaseHTTPRequestHandler, HTTPServer

          SEEN = sys.argv[1]


          class Stub(BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers.get("content-length") or 0))
                  with open(SEEN, "a") as f:
                      f.write("%s %s\n" % (self.path, self.headers.get("authorization", "")))
                  body = json.dumps({
                      "id": "chatcmpl-ci", "object": "chat.completion", "model": "gpt-4o-mini",
                      "choices": [{"index": 0, "message": {"role": "assistant", "content": "ok"}, "finish_reason": "stop"}],
                      "usage": {"prompt_tokens": 5, "completion_tokens": 1, "total_tokens": 6},
                  }).encode()
                  self.send_response(200)
                  self.send_header("content-type", "application/json")
                  self.send_header("content-length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *args):
                  pass


          HTTPServer(("0.0.0.0", 8999), Stub).serve_forever()
          PY
          : >"$d/seen.txt"
          nohup python3 "$d/stub.py" "$d/seen.txt" >"$d/stub.log" 2>&1 &
          # The host as a container on the stack's network reaches it: docker0's address.
          host="$(ip -4 -o addr show docker0 | awk '{print $4}' | cut -d/ -f1)"
          echo "DOOR_IN=$d" >>"$GITHUB_ENV"
          echo "DOOR_UPSTREAM_CI=http://$host:8999/v1/chat/completions" >>"$GITHUB_ENV"

      - name: first install
        run: |
          extra=""
          [ "${{ matrix.profile }}" = delegation ] && extra="WITH_DELEGATION=1 WITH_DELEGATION_DEMO_ISSUER=1"
          [ "${{ matrix.profile }}" = typed-risk ] && extra="WITH_TYPED=1 TYPED_RISK_SIGNAL=1"
          # The identity leg gives its own keys and no broker line, which agent tokens refuse by default, so it
          # turns them off by name (CLAUDE.md invariant 47). static-only is the weaker way out, on purpose.
          [ "${{ matrix.profile }}" = identity ] && extra="CLIENT_KEYS_FILE=$IDENTITY_IN/keys.txt IDENTITY_MAP_FILE=$IDENTITY_IN/identity.json WITH_AGENT_TOKENS=0"
          [ "${{ matrix.profile }}" = static-only ] && extra="WITH_AGENT_TOKENS=0"
          [ "${{ matrix.profile }}" = openai-door ] && extra="OPENAI_DOOR=1 OPENAI_DOOR_UPSTREAM=$DOOR_UPSTREAM_CI OPENAI_DOOR_CLIENT_KEYS_FILE=$DOOR_IN/keys.txt OPENAI_DOOR_IDENTITY_MAP_FILE=$DOOR_IN/identity.json"
          sudo env STACK_DIR=/opt/agent-stack $extra ./install.sh 2>&1 | tee install-1.log
          grep -q "every check passed" install-1.log || { echo "::error::the first install did not pass every check"; exit 1; }

      # What the first install minted (CLAUDE.md invariant 35), as digests only, so the
      # re-run can be held to keeping it byte for byte. The identity leg gave files.
      - name: the keys the first install minted
        if: matrix.profile != 'identity'
        run: |
          cd /opt/agent-stack
          sudo grep -E '^(GENARYX_COPILOT_FUSE_KEY|GATEWAY_AGENT_KEY|GATEWAY_CLIENT_KEYS)=' .env | sort | sha256sum >"$RUNNER_TEMP/minted-1.sha"
          sudo sha256sum agent-key >>"$RUNNER_TEMP/minted-1.sha"

      # A fresh box names two static keys, felyx and broker, and refuses any other static key until it is
      # moved to a token or named on purpose (CLAUDE.md invariant 47). This runs BEFORE the re-run, because
      # the re-run keeps every key id the box already had on the list.
      - name: a fresh box refuses a static key it does not list
        if: matrix.profile != 'identity' && matrix.profile != 'static-only'
        run: |
          cd /opt/agent-stack
          sudo grep -qx "TOKENFUSE_AGENT_TOKENS='require'" .env || { echo "::error::.env does not set the gateway to require agent tokens"; exit 1; }
          sudo grep -qx "TOKENFUSE_AGENT_TOKENS_STATIC_KEYS='felyx,broker'" .env \
            || { echo "::error::the gateway's static-key list on a fresh box is not felyx,broker"; sudo grep '^TOKENFUSE_AGENT_TOKENS_STATIC_KEYS=' .env; exit 1; }
          akey="$(sudo cat agent-key)"
          fkey="$(sudo sed -n "s/^GENARYX_COPILOT_FUSE_KEY='\(.*\)'\$/\1/p" .env)"
          call() {
            curl -s -o "$RUNNER_TEMP/body.json" -w '%{http_code}' -X POST http://127.0.0.1:4100/v1/messages \
              -H 'content-type: application/json' -H "x-fuse-run-id: ci-$RANDOM" -H 'x-fuse-budget-usd: 0.000001' \
              "$@" -d '{"model":"claude-haiku-4-5","max_tokens":1,"messages":[{"role":"user","content":"ci"}]}'
            printf ' %s\n' "$(sed -n 's/.*"type":"\([a-z_]*\)".*/\1/p' "$RUNNER_TEMP/body.json")"
          }
          a="$(call -H "x-fuse-key: $akey" -H 'x-fuse-agent-id: agent://local/agents/ci')"
          b="$(call -H "x-fuse-key: $fkey" -H 'x-fuse-agent-id: agent://local/genaryx/felyx')"
          echo "the agents' static key, not listed: $a | Felyx's listed key: $b"
          [ "$a" = "401 agent_token_required" ] || { echo "::error::a static key the box does not list was not refused 401 agent_token_required: $a"; exit 1; }
          [ "${b%% *}" = 402 ] || { echo "::error::Felyx's listed key did not get past identity to the budget (402): $b"; exit 1; }

      - name: re-run over the same box
        run: |
          # The re-run says nothing about the risk signal: it must stay on from
          # what the first run saved in .env. The stub is not saved, so it is
          # asked for again, exactly as an operator does. Nor about the identity
          # files: the keys and the map must survive from the first run. Nor about
          # the OpenAI door: it must stay on, with its keys, map and upstream.
          extra=""
          [ "${{ matrix.profile }}" = delegation ] && extra="WITH_DELEGATION=1 WITH_DELEGATION_DEMO_ISSUER=1"
          [ "${{ matrix.profile }}" = typed-risk ] && extra="WITH_TYPED=1"
          [ "${{ matrix.profile }}" = identity ] && extra="WITH_AGENT_TOKENS=0"
          [ "${{ matrix.profile }}" = static-only ] && extra="WITH_AGENT_TOKENS=0"
          sudo env STACK_DIR=/opt/agent-stack $extra ./install.sh 2>&1 | tee install-2.log
          grep -q "every check passed" install-2.log || { echo "::error::the re-run did not pass every check"; exit 1; }

      - name: vouchryx runs with agent tokens on by default, and not with them off
        run: |
          cd /opt/agent-stack
          if sudo docker compose ps --services | grep -qx vouchryx; then running=yes; else running=no; fi
          want=yes; case "${{ matrix.profile }}" in identity|static-only) want=no ;; esac
          echo "vouchryx running: $running (want $want)"
          [ "$running" = "$want" ]

      - name: the typed risk signal is up only when asked for
        run: |
          cd /opt/agent-stack
          if sudo docker compose ps --services | grep -qx typryx-wardryx-proxy; then running=yes; else running=no; fi
          want=no; [ "${{ matrix.profile }}" = typed-risk ] && want=yes
          echo "typryx-wardryx-proxy running: $running (want $want)"
          [ "$running" = "$want" ]
          # nothing seeds a rule that reads the signal. An explicit if: a bare
          # `! grep` is exempt from errexit and could never fail this step.
          if grep -q hold_if_signal policy.yaml; then echo "::error::policy.yaml carries a hold_if_signal rule nobody wrote"; exit 1; fi

      - name: the OpenAI door is up only when asked for, and 4110 answers only then
        run: |
          names="$(sudo docker ps --format '{{.Names}}')"
          if grep -q 'tokenfuse-gateway-openai' <<<"$names"; then running=yes; else running=no; fi
          if curl -fsS -m3 -o /dev/null http://127.0.0.1:4110/healthz; then answers=yes; else answers=no; fi
          want=no; [ "${{ matrix.profile }}" = openai-door ] && want=yes
          echo "tokenfuse-gateway-openai running: $running, 4110 answers: $answers (want $want)"
          [ "$running" = "$want" ] && [ "$answers" = "$want" ]

      - name: the OpenAI door holds callers to its own keys and map, and forwards the caller's key
        if: matrix.profile == 'openai-door'
        run: |
          cd /opt/agent-stack
          [ "$(sudo grep -c '^OPENAI_DOOR_CLIENT_KEYS=' .env)" = 1 ] || { echo "::error::.env does not carry exactly one OPENAI_DOOR_CLIENT_KEYS after the re-run"; exit 1; }
          # The gateway always has a client-keys line now (minted when no file is
          # given), so the check is that none of the door's secrets is in it.
          gw="$(sudo sed -n 's/^GATEWAY_CLIENT_KEYS=//p' .env)"
          [ -n "$gw" ] || { echo "::error::the gateway has no client keys line, and it is required"; exit 1; }
          while IFS= read -r line; do
            s="${line%%:*}"; [ -n "$s" ] || continue
            if grep -qF -- "$s" <<<"$gw"; then echo "::error::the door's keys reached the gateway's line"; exit 1; fi
          done <"$DOOR_IN/keys.txt"
          sudo cmp -s identity-openai/identity.json "$DOOR_IN/identity.json" || { echo "::error::the door's installed map is not the map given"; exit 1; }
          fkey="$(sed -n 's/:flint$//p' "$DOOR_IN/keys.txt")"
          if grep -qF "$fkey" "$GITHUB_WORKSPACE/install-1.log" "$GITHUB_WORKSPACE/install-2.log"; then
            echo "::error::a door client key secret appears in the installer's output"; exit 1
          fi
          # status, then the body, of one call on the OpenAI wire; the caller's own
          # provider key travels as Authorization, as an OpenAI SDK sends it.
          call() {
            local budget="$1"
            shift
            curl -s -o "$RUNNER_TEMP/door-body.json" -w '%{http_code}' -X POST http://127.0.0.1:4110/v1/chat/completions \
              -H 'content-type: application/json' -H "x-fuse-run-id: ci-door-$RANDOM" -H "x-fuse-budget-usd: $budget" \
              -H 'authorization: Bearer ci-caller-provider-key' "$@" \
              -d '{"model":"gpt-4o-mini","max_tokens":1,"messages":[{"role":"user","content":"ci"}]}'
          }
          a="$(call 0.000001 -H 'x-fuse-agent-id: agent://ci.invalid/flint/one')"
          b="$(call 0.000001 -H 'x-fuse-key: ci-not-a-key-0000000000000000' -H 'x-fuse-agent-id: agent://ci.invalid/flint/one')"
          c="$(call 0.000001 -H "x-fuse-key: $fkey" -H 'x-fuse-agent-id: agent://ci.invalid/brume/one')"
          cbody="$(cat "$RUNNER_TEMP/door-body.json")"
          d="$(call 0.000001 -H "x-fuse-key: $fkey" -H 'x-fuse-agent-id: agent://ci.invalid/flint/one')"
          e="$(call 1.00 -H "x-fuse-key: $fkey" -H 'x-fuse-agent-id: agent://ci.invalid/flint/one')"
          ebody="$(cat "$RUNNER_TEMP/door-body.json")"
          echo "no key: $a | unknown key: $b | flint's key as brume: $c | flint's key as flint, budget 1e-6: $d | budget 1.00: $e"
          [ "$a" = 401 ] || { echo "::error::a call with no key was not refused 401"; exit 1; }
          [ "$b" = 401 ] || { echo "::error::a call with an unknown key was not refused 401"; exit 1; }
          [ "$c" = 403 ] && grep -q identity_mismatch <<<"$cbody" || { echo "::error::a key speaking as another agent was not refused 403 identity_mismatch: $cbody"; exit 1; }
          [ "$d" = 402 ] || { echo "::error::a key speaking as its own agent did not get past identity to the budget (402)"; exit 1; }
          [ "$e" = 200 ] && grep -q '"choices"' <<<"$ebody" || { echo "::error::an admitted call was not answered by the upstream: $e $ebody"; exit 1; }
          echo "the stub saw:"; cat "$DOOR_IN/seen.txt"
          grep -qx '/v1/chat/completions Bearer ci-caller-provider-key' "$DOOR_IN/seen.txt" \
            || { echo "::error::the upstream did not receive the caller's own Authorization on /v1/chat/completions"; exit 1; }
          [ "$(grep -c . "$DOOR_IN/seen.txt")" = 1 ] || { echo "::error::a refused call reached the upstream"; exit 1; }
          sudo docker run --rm -v agent-stack_events:/e:ro busybox:1.36 grep -q identity_mismatch /e/tokenfuse-openai.ndjson \
            || { echo "::error::the door's refusal did not reach its own stream, tokenfuse-openai.ndjson"; exit 1; }
          if sudo docker run --rm -v agent-stack_events:/e:ro busybox:1.36 grep -q 'ci.invalid/brume' /e/tokenfuse.ndjson; then
            echo "::error::the door's events reached the gateway's stream"; exit 1
          fi

      - name: client keys and the identity map are kept, and the gateway holds callers to them
        if: matrix.profile == 'identity'
        run: |
          cd /opt/agent-stack
          [ "$(sudo grep -c '^GATEWAY_CLIENT_KEYS=' .env)" = 1 ] || { echo "::error::.env does not carry exactly one GATEWAY_CLIENT_KEYS after the re-run"; exit 1; }
          sudo cmp -s identity/identity.json "$IDENTITY_IN/identity.json" || { echo "::error::the installed map is not the map given"; exit 1; }
          if grep -qF "$(sed -n 's/:treasury-bots$//p' "$IDENTITY_IN/keys.txt")" "$GITHUB_WORKSPACE/install-1.log" "$GITHUB_WORKSPACE/install-2.log"; then
            echo "::error::a client key secret appears in the installer's output"; exit 1
          fi
          tkey="$(sed -n 's/:treasury-bots$//p' "$IDENTITY_IN/keys.txt")"
          # status and the error type of one metered call; the budget of one
          # micro-dollar stops an admitted call before it reaches a provider.
          call() {
            curl -s -o "$RUNNER_TEMP/body.json" -w '%{http_code}' -X POST http://127.0.0.1:4100/v1/messages \
              -H 'content-type: application/json' -H "x-fuse-run-id: ci-$RANDOM" -H 'x-fuse-budget-usd: 0.000001' \
              "$@" -d '{"model":"claude-haiku-4-5","max_tokens":1,"messages":[{"role":"user","content":"ci"}]}'
            printf ' %s\n' "$(sed -n 's/.*"type":"\([a-z_]*\)".*/\1/p' "$RUNNER_TEMP/body.json")"
          }
          a="$(call -H 'x-fuse-agent-id: agent://ci.invalid/treasury/recon')"
          b="$(call -H 'x-fuse-key: ci-not-a-key-0000000000000000' -H 'x-fuse-agent-id: agent://ci.invalid/treasury/recon')"
          c="$(call -H "x-fuse-key: $tkey" -H 'x-fuse-agent-id: agent://ci.invalid/research/summariser')"
          d="$(call -H "x-fuse-key: $tkey" -H 'x-fuse-agent-id: agent://ci.invalid/treasury/recon')"
          echo "no key: $a | unknown key: $b | treasury key as a research agent: $c | treasury key as its own agent: $d"
          [ "$a" = "401 unauthorized" ] || { echo "::error::a call with no key was not refused 401"; exit 1; }
          [ "$b" = "401 unauthorized" ] || { echo "::error::a call with an unknown key was not refused 401"; exit 1; }
          [ "$c" = "403 identity_mismatch" ] || { echo "::error::a key speaking as another unit's agent was not refused 403 identity_mismatch"; exit 1; }
          [ "${d%% *}" = 402 ] || { echo "::error::a key speaking as its own agent did not get past identity to the budget (402)"; exit 1; }

      # CLAUDE.md invariant 35, on every leg that gave no files: the gateway minted keys
      # for Felyx and for the operator's agents, kept them through the re-run, and holds
      # each to its own agent ids. A budget of one micro-dollar stops an admitted call
      # before it reaches a provider, so 402 is "past identity". No key is printed.
      - name: the gateway holds callers to the keys the installer minted
        if: matrix.profile != 'identity'
        run: |
          cd /opt/agent-stack
          sudo grep -qx "GATEWAY_IDENTITY_MINTED='1'" .env || { echo "::error::.env does not mark the keys as minted"; exit 1; }
          [ "$(sudo grep -c '^GATEWAY_CLIENT_KEYS=' .env)" = 1 ] || { echo "::error::.env does not carry exactly one GATEWAY_CLIENT_KEYS"; exit 1; }
          { sudo grep -E '^(GENARYX_COPILOT_FUSE_KEY|GATEWAY_AGENT_KEY|GATEWAY_CLIENT_KEYS)=' .env | sort | sha256sum; sudo sha256sum agent-key; } >"$RUNNER_TEMP/minted-2.sha"
          diff "$RUNNER_TEMP/minted-1.sha" "$RUNNER_TEMP/minted-2.sha" >/dev/null || { echo "::error::the re-run changed a minted key, the spec or the agents' key file"; exit 1; }
          [ "$(sudo stat -c '%a %U' agent-key)" = "600 root" ] || { echo "::error::agent-key is $(sudo stat -c '%a %U' agent-key), not 600 root"; exit 1; }
          akey="$(sudo cat agent-key)"
          fkey="$(sudo sed -n "s/^GENARYX_COPILOT_FUSE_KEY='\(.*\)'\$/\1/p" .env)"
          [ -n "$akey" ] && [ -n "$fkey" ] && [ "$akey" != "$fkey" ] || { echo "::error::the agents' key or Felyx's key is missing, or they are the same"; exit 1; }
          [ "$(sudo sed -n "s/^GATEWAY_AGENT_KEY='\(.*\)'\$/\1/p" .env)" = "$akey" ] || { echo "::error::agent-key does not hold the GATEWAY_AGENT_KEY .env holds"; exit 1; }
          if grep -qF -e "$akey" -e "$fkey" "$GITHUB_WORKSPACE/install-1.log" "$GITHUB_WORKSPACE/install-2.log"; then
            echo "::error::a minted key appears in the installer's output"; exit 1
          fi
          grep -qF '/opt/agent-stack/agent-key' "$GITHUB_WORKSPACE/install-1.log" || { echo "::error::the first install did not name the agents' key file"; exit 1; }
          [ "$(sudo docker compose exec -T console printenv GENARYX_COPILOT_FUSE_KEY)" = "$fkey" ] || { echo "::error::the console does not hold Felyx's minted key"; exit 1; }
          call() {
            curl -s -o "$RUNNER_TEMP/body.json" -w '%{http_code}' -X POST http://127.0.0.1:4100/v1/messages \
              -H 'content-type: application/json' -H "x-fuse-run-id: ci-$RANDOM" -H 'x-fuse-budget-usd: 0.000001' \
              "$@" -d '{"model":"claude-haiku-4-5","max_tokens":1,"messages":[{"role":"user","content":"ci"}]}'
            printf ' %s\n' "$(sed -n 's/.*"type":"\([a-z_]*\)".*/\1/p' "$RUNNER_TEMP/body.json")"
          }
          a="$(call -H 'x-fuse-agent-id: agent://local/agents/ci')"
          b="$(call -H "x-fuse-key: $akey" -H 'x-fuse-agent-id: agent://local/agents/ci')"
          c="$(call -H "x-fuse-key: $akey" -H 'x-fuse-agent-id: agent://local/genaryx/felyx')"
          d="$(call -H "x-fuse-key: $fkey" -H 'x-fuse-agent-id: agent://local/genaryx/felyx')"
          e="$(call -H "x-fuse-key: $fkey" -H 'x-fuse-agent-id: agent://local/agents/ci')"
          echo "no key: $a | agents' key as an agent: $b | agents' key as Felyx: $c | Felyx's key as Felyx: $d | Felyx's key as an agent: $e"
          [ "$a" = "401 unauthorized" ] || { echo "::error::a call with no key was not refused 401"; exit 1; }
          [ "${b%% *}" = 402 ] || { echo "::error::the agents' key speaking as an agent did not get past identity to the budget (402)"; exit 1; }
          [ "$c" = "403 identity_mismatch" ] || { echo "::error::the agents' key speaking as Felyx was not refused 403 identity_mismatch"; exit 1; }
          [ "${d%% *}" = 402 ] || { echo "::error::Felyx's key speaking as Felyx did not get past identity to the budget (402)"; exit 1; }
          [ "$e" = "403 identity_mismatch" ] || { echo "::error::Felyx's key speaking as an agent was not refused 403 identity_mismatch"; exit 1; }

      - name: "static-only: agent tokens are off, nothing enrols, and no static-key list is written"
        if: matrix.profile == 'static-only'
        run: |
          cd /opt/agent-stack
          sudo grep -qx "TOKENFUSE_AGENT_TOKENS='off'" .env || { echo "::error::WITH_AGENT_TOKENS=0 did not write off"; exit 1; }
          if sudo grep -qE '^(TOKENFUSE_AGENT_TOKENS_STATIC_KEYS|TOKENFUSE_MCP_AGENT_TOKENS_STATIC_KEYS|WARDRYX_AGENT_TOKEN_ISSUER)=' .env; then
            echo "::error::the off path left a static-key list or a wardryx token setting in .env"; exit 1
          fi

      - name: a box given its own files carries no minted keys
        if: matrix.profile == 'identity'
        run: |
          cd /opt/agent-stack
          if sudo grep -qE '^(GATEWAY_IDENTITY_MINTED|GATEWAY_AGENT_KEY)=' .env; then echo "::error::a box given its own files minted keys"; exit 1; fi
          if sudo test -e agent-key; then echo "::error::a box given its own files has an agents' key file"; exit 1; fi

      - name: the chain verifier is up on every profile
        run: |
          cd /opt/agent-stack
          sudo docker compose ps --status running --services | grep -qx agent-conform

      # CLAUDE.md invariant 38, on every leg: a container on the agents network, the
      # one an operator's agent container joins, reaches the gateway and nothing else
      # outside the box. It has no name for an address on the internet, no route to
      # one, and no plane by name. The first probe is a positive control on the edge
      # network, so a runner with no internet cannot make the negative checks pass.
      - name: "agents network: no direct internet, the gateway reachable"
        run: |
          probe() { sudo docker run --rm --network "$1" busybox:1.36 sh -c "$2" >/dev/null 2>&1; }
          if probe agent-stack_edge 'wget -q -T10 -O /dev/null http://example.com/'; then
            echo "positive control: a container on the edge network reaches example.com"
          else
            echo "::error::the positive control failed: edge cannot reach example.com, so the checks below would prove nothing"; exit 1
          fi
          if probe agent-stack_agents 'wget -q -T5 -O /dev/null http://example.com/'; then
            echo "::error::a container on the agents network reached example.com by name"; exit 1
          fi
          if probe agent-stack_agents 'wget -q -T5 -O /dev/null http://1.1.1.1/'; then
            echo "::error::a container on the agents network reached 1.1.1.1 directly"; exit 1
          fi
          if probe agent-stack_agents 'wget -q -T5 -O /dev/null http://wardryx:8090/healthz'; then
            echo "::error::a container on the agents network reached wardryx, a plane, by name"; exit 1
          fi
          if probe agent-stack_agents 'wget -q -T5 -O /dev/null http://tokenfuse-gateway:4100/healthz'; then
            echo "the gateway answers from the agents network"
          else
            echo "::error::a container on the agents network cannot reach the gateway"; exit 1
          fi

      # CLAUDE.md invariant 38, the browser's path. The browser's network is shared with
      # wardryx alone: a container on it reaches wardryx's healthz (the policy plane
      # that decides every fetch) and nothing else, with no name for the gateway and no
      # route to the internet. The positive control is the edge network, as above.
      - name: "browser policy network: wardryx reachable, nothing else"
        run: |
          probe() { sudo docker run --rm --network "$1" busybox:1.36 sh -c "$2" >/dev/null 2>&1; }
          if probe agent-stack_edge 'wget -q -T10 -O /dev/null http://example.com/'; then
            echo "positive control: a container on the edge network reaches example.com"
          else
            echo "::error::the positive control failed: edge cannot reach example.com, so the checks below would prove nothing"; exit 1
          fi
          if probe agent-stack_browser-policy 'wget -q -T5 -O /dev/null http://wardryx:8090/healthz'; then
            echo "the browser's policy network reaches wardryx"
          else
            echo "::error::a container on the browser's policy network cannot reach wardryx, so the browser could not be decided"; exit 1
          fi
          if probe agent-stack_browser-policy 'wget -q -T5 -O /dev/null http://tokenfuse-gateway:4100/healthz'; then
            echo "::error::a container on the browser's policy network reached the gateway by name"; exit 1
          fi
          if probe agent-stack_browser-policy 'wget -q -T5 -O /dev/null http://example.com/'; then
            echo "::error::a container on the browser's policy network reached example.com directly"; exit 1
          fi

      - name: turning the typed risk signal off removes its proxy
        if: matrix.profile == 'typed-risk'
        run: |
          sudo env STACK_DIR=/opt/agent-stack WITH_TYPED=1 TYPED_RISK_SIGNAL=0 ./install.sh 2>&1 | tee install-3.log
          grep -q "every check passed" install-3.log || { echo "::error::the install that turned the signal off did not pass every check"; exit 1; }
          cd /opt/agent-stack
          if sudo docker compose ps --services | grep -qx typryx-wardryx-proxy; then echo "::error::the proxy is still running after TYPED_RISK_SIGNAL=0"; exit 1; fi
          if sudo grep -q '^TYPED_RISK_' .env; then echo "::error::TYPED_RISK_ lines are still in .env after TYPED_RISK_SIGNAL=0"; exit 1; fi

      # CLAUDE.md invariant 36, on the broker as a box without the risk signal runs it:
      # it asks wardryx directly, refuses an unattributed call, refuses a raw secret in
      # tool arguments, and refuses a tool the starter policy denies. AWS's documented
      # example key id is a secret's shape and nobody's secret.
      - name: the MCP broker blocks raw secrets and asks wardryx about every tool call
        if: matrix.profile == 'typed-risk'
        run: |
          cd /opt/agent-stack
          [ "$(sudo docker compose exec -T tokenfuse-mcp-broker printenv TOKENFUSE_WARDRYX_URL)" = http://wardryx:8090 ] \
            || { echo "::error::without the risk signal the broker does not ask wardryx directly"; exit 1; }
          mkey="$(sudo sed -n 's/^TOKENFUSE_MCP_KEYS=\([^:]*\):.*/\1/p' .env | head -1)"
          mcp() {
            curl -s -w ' %{http_code}' -X POST http://127.0.0.1:4200/mcp -H 'content-type: application/json' \
              -H 'X-Fuse-Mcp-Upstream: typryx' -H "x-fuse-key: $mkey" "$@"
          }
          ask='{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"ask","arguments":{"template":"eval.outcome_met","state":{"task":"2+2","final_answer":"4"}},"_meta":{"typryx/key":"{{secret:typryx_key}}"}}}'
          raw='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"ask","arguments":{"template":"eval.outcome_met","state":{"task":"note AKIAIOSFODNN7EXAMPLE","final_answer":"4"}},"_meta":{"typryx/key":"{{secret:typryx_key}}"}}}'
          deny='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"shell_exec","arguments":{"cmd":"id"}}}'
          a="$(mcp -H 'x-fuse-agent-id: agent://local.invalid/ci' -d "$ask")"
          b="$(mcp -d "$ask")"
          c="$(mcp -H 'x-fuse-agent-id: agent://local.invalid/ci' -d "$raw")"
          d="$(mcp -H 'x-fuse-agent-id: agent://mockryx.local/ci' -d "$deny")"
          echo "ask: ${a: -3} | no agent id: ${b: -3} | raw secret: $(cut -c1-90 <<<"$c") | denied tool: $(cut -c1-90 <<<"$d")"
          grep -q '"isError":false' <<<"$a" || { echo "::error::an attributed ask through the broker was not answered: $a"; exit 1; }
          [ "${b: -3}" = 400 ] || { echo "::error::a tools/call with no x-fuse-agent-id was not refused 400"; exit 1; }
          grep -q '"code":-32002' <<<"$c" || { echo "::error::a raw secret in tool arguments was not refused -32002: $c"; exit 1; }
          grep -q '"code":-32004' <<<"$d" || { echo "::error::a tool the starter policy denies was not refused -32004: $d"; exit 1; }

      - name: turning the OpenAI door off removes it and keeps its lines
        if: matrix.profile == 'openai-door'
        run: |
          sudo env STACK_DIR=/opt/agent-stack OPENAI_DOOR=0 ./install.sh 2>&1 | tee install-3.log
          grep -q "every check passed" install-3.log || { echo "::error::the install that turned the door off did not pass every check"; exit 1; }
          names="$(sudo docker ps -a --format '{{.Names}}')"
          if grep -q 'tokenfuse-gateway-openai' <<<"$names"; then echo "::error::the door's container is still there after OPENAI_DOOR=0"; exit 1; fi
          if curl -fsS -m3 -o /dev/null http://127.0.0.1:4110/healthz; then echo "::error::4110 still answers after OPENAI_DOOR=0"; exit 1; fi
          cd /opt/agent-stack
          if sudo grep -q '^OPENAI_DOOR=' .env; then echo "::error::OPENAI_DOOR is still in .env after OPENAI_DOOR=0"; exit 1; fi
          sudo grep -q '^OPENAI_DOOR_CLIENT_KEYS=' .env || { echo "::error::OPENAI_DOOR=0 dropped the door's keys"; exit 1; }

      # Every leg ends by reading the stack it just installed with `status`, the
      # same checks the install ran, minus the ones that would write. A snapshot
      # before and after shows the read changed nothing: the containers, their
      # start times and restart counts, and .env, byte for byte.
      - name: snapshot the stack before status
        run: |
          cd /opt/agent-stack
          sudo sha256sum .env >"$RUNNER_TEMP/before.txt"
          sudo docker compose ps -a --format '{{.Name}} {{.State}} {{.Image}}' | sort >>"$RUNNER_TEMP/before.txt"
          for id in $(sudo docker compose ps -aq | sort); do
            sudo docker inspect -f '{{.Name}} {{.State.StartedAt}} {{.RestartCount}}' "$id"
          done >>"$RUNNER_TEMP/before.txt"

      - name: install.sh status passes on the stack this leg installed
        run: |
          set -o pipefail
          sudo env STACK_DIR=/opt/agent-stack ./install.sh status 2>&1 | tee "$RUNNER_TEMP/status.log"

      - name: status changed nothing
        run: |
          cd /opt/agent-stack
          sudo sha256sum .env >"$RUNNER_TEMP/after.txt"
          sudo docker compose ps -a --format '{{.Name}} {{.State}} {{.Image}}' | sort >>"$RUNNER_TEMP/after.txt"
          for id in $(sudo docker compose ps -aq | sort); do
            sudo docker inspect -f '{{.Name}} {{.State.StartedAt}} {{.RestartCount}}' "$id"
          done >>"$RUNNER_TEMP/after.txt"
          diff "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt" || { echo "::error::status changed the stack"; exit 1; }

      - name: state on failure
        if: failure()
        run: |
          cd /opt/agent-stack 2>/dev/null && sudo docker compose ps -a || true
          cd /opt/agent-stack 2>/dev/null && sudo docker compose logs --tail=40 || true
