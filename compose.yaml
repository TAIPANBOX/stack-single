# The agent stack on one machine, for real use rather than a local try.
#
# This is the same wiring `stack-k8s` proved on a five-node cluster, minus
# Kubernetes: same images, same environment variables, same ports, same
# failure modes. Docker's own DNS resolves service names exactly the way
# Kubernetes Services did, so `http://wardryx:8090` means the same thing in
# both, and nothing had to be rewritten to move between them.
#
# What is deliberately NOT published to the host:
#   cloud (8080), wardryx (8090), idryx (8081) and postgres (5432) have no
#   `ports:` at all. They are reachable only from inside this compose network,
#   which is the single-box equivalent of the cluster's default-deny
#   NetworkPolicy. The gateway is the one service agents elsewhere must reach,
#   and the console is bound to loopback so it arrives over the operator's own
#   tunnel rather than off the open internet.
#
# Secrets come from `.env`, which `install.sh` generates with 0600 and never
# commits. Nothing here has a default credential.

name: agent-stack

x-restart: &restart
  restart: unless-stopped

services:
  # ---- one-shot: make the shared volumes writable --------------------------
  # Kubernetes has `fsGroup` for exactly this and Compose has no equivalent, so
  # this is the equivalent, written out. A fresh Docker named volume is created
  # root:root 0755 unless the image already contains that path, and every
  # service here runs as a non-root user, so without this the policy plane
  # crash-loops on "permission denied" writing its own event file and the
  # gateway drops every trace with a WARN nobody reads. The cluster never
  # showed this because its RWX volume came from a provisioner that hands out
  # a permissive share; a local volume does not.
  #
  # Two UID families share the event log: the Go planes are 65532 (distroless
  # nonroot) and the Rust and Python ones are 10001. So the directory is owned
  # by GROUP 10001 with the setgid bit, both families run with that GID, and
  # every file created inside inherits it. No writer ever needs write access to
  # another's file: each plane appends only to its own.
  init-volumes:
    image: busybox:1.36
    user: "0:0"
    command:
      - sh
      - -euc
      - |
        mkdir -p /vol/events /vol/traces /vol/cloud /vol/heraldyx /vol/records
        chown 0:10001 /vol/events && chmod 2775 /vol/events
        chown 10001:10001 /vol/traces /vol/cloud && chmod 0775 /vol/traces /vol/cloud
        # The notifier runs 65532:10001 like the Go planes, and writes exactly
        # one file here. Same trap as the others: a fresh named volume is
        # root:root 0755, and without this line the process starts, reads the
        # log, decides correctly and then cannot save what it decided, so
        # every restart re-sends what it already sent.
        chown 65532:10001 /vol/heraldyx && chmod 0775 /vol/heraldyx
        # The record plane runs 10001:10001 and is the only writer here.
        # Same trap as the others: a fresh named volume is root:root 0755,
        # so without this the seal starts, reads the bus, and cannot write
        # what it read.
        chown 10001:10001 /vol/records && chmod 0775 /vol/records
        # idryx is told to load the gateway's log at startup and exits if the
        # file is absent, which on a box that has served no traffic yet it
        # always is. An empty file is a valid empty log, and pre-creating it is
        # the difference between "no events yet" and a crash loop.
        for f in tokenfuse.ndjson wardryx.ndjson; do
          [ -e "/vol/events/$$f" ] || : > "/vol/events/$$f"
          chown 10001:10001 "/vol/events/$$f" && chmod 0664 "/vol/events/$$f"
        done
        echo "volumes ready"
    volumes:
      - events:/vol/events
      - traces:/vol/traces
      - cloudstate:/vol/cloud
      - heraldyxstate:/vol/heraldyx
    restart: "no"

  # ---- the policy plane's durable store ------------------------------------
  # Every console-block policy and the whole approval trail lives here, so a
  # restart must not forget what the fleet is forbidden to do.
  policy-db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wardryx
      POSTGRES_USER: wardryx
      POSTGRES_PASSWORD: ${POLICY_DB_PASSWORD:?set by install.sh}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardryx -d wardryx"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- policy --------------------------------------------------------------
  wardryx:
    <<: *restart
    image: stack/wardryx:dev
    # The image's own 65532:65532, with the GID moved to the one that owns the
    # shared event directory. The binary is a static Go binary and reads no
    # /etc/passwd, so a numeric pair it was not built with is fine.
    user: "65532:10001"
    command:
      - serve
      - -addr
      - 0.0.0.0:8090
      - -events
      - /var/lib/stack/events/wardryx.ndjson
      - -policy
      - /etc/wardryx/policy.yaml
    environment:
      WARDRYX_KEYS: ${WARDRYX_KEYS:?set by install.sh}
      # WARDRYX_DB, not WARDRYX_DSN. wardryx reads WARDRYX_DB
      # (internal/config/config.go) and has never read WARDRYX_DSN, so this
      # compose generated a correct DSN, waited for policy-db to be healthy,
      # and then handed the value over under a name the binary ignores. The
      # effect is the one stack-k8s spells out in its own manifest: with no
      # DB, wardryx keeps policy AND approvals in memory, so a restart
      # silently drops every console-written policy and unfreezes the fleet
      # while the console still shows it stopped.
      WARDRYX_DB: ${POLICY_DB_DSN:?set by install.sh}
      WARDRYX_APPROVAL_SECRET: ${APPROVAL_SECRET:?set by install.sh}
      # Every policy set this wardryx makes effective, kept under its own
      # policy_version, on the events volume that is already here. No new
      # volume and no new storage: a policy set is kilobytes and the archive
      # is content-addressed, so the same set is kept once however often it
      # is loaded.
      #
      # Unset, wardryx serves exactly as before and loses one thing: the
      # policy store is a live control surface where writes overwrite and
      # deletes remove, so the rules a recorded decision names are gone at
      # the next policy write and `wardryx replay` can examine none of them.
      # The loss is one-way, which is why this is set now rather than when
      # somebody first wants a replay: it works forward from this day only.
      WARDRYX_POLICY_ARCHIVE: /var/lib/stack/events/wardryx-policy-archive
    volumes:
      - events:/var/lib/stack/events
      - ./policy.yaml:/etc/wardryx/policy.yaml:ro
    depends_on:
      policy-db:
        condition: service_healthy
      init-volumes:
        condition: service_completed_successfully

  # ---- identity ------------------------------------------------------------
  # Read-only on the event log: idryx builds its graph FROM it and never
  # writes, and the mount says so.
  idryx:
    <<: *restart
    image: stack/idryx:dev
    user: "65532:10001"
    command:
      - serve
      - --addr
      - 0.0.0.0:8081
      - --load
      - tokenfuse:/var/lib/stack/events/tokenfuse.ndjson
    volumes:
      - events:/var/lib/stack/events:ro
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- the notifier: the part that writes to you ---------------------------
  # Reads the shared event log and mails the operator when one of their agents
  # crosses a line. It runs on every box, and on a box where nobody filled in
  # ALERT_TO it watches the log, stays healthy and sends nothing: not having
  # mail is a choice an operator makes, not a broken deployment.
  #
  # `:ro` on the event volume, like idryx above and for the same reason: this
  # process reads the log and can do nothing else to it. Every limit it applies
  # is a limit on messages, never on evidence.
  #
  # Unlike the cluster, a compose box cannot express "this container may reach
  # the mail ports and nothing else": Docker gives every container outbound
  # access and there is no NetworkPolicy here to narrow it. That difference is
  # real and is not hidden: on one machine the boundary is the machine.
  heraldyx:
    <<: *restart
    image: stack/heraldyx:dev
    user: "65532:10001"
    environment:
      HERALDYX_EVENTS: /var/lib/stack/events
      HERALDYX_STATE: /var/lib/stack/heraldyx/state.json
      # "high", not stack-up's "medium": deliberately different, and
      # previously unstated anywhere. This is a real deployment governing
      # whatever fleet the operator actually points at it; stack-up is the
      # local sandbox meant to show a newcomer what an alert looks like
      # within a few minutes of ./up.sh. A "high" default here keeps a real
      # operator's inbox quiet until something serious happens; stack-up's
      # lower default gives its short demo something to show. Same
      # variable, opposite correct default, for two different audiences.
      # Overridable per box via ALERT_MIN_SEVERITY in .env.
      HERALDYX_MIN_SEVERITY: ${ALERT_MIN_SEVERITY:-high}
      # Empty is the default and means "send nothing". `:-` rather than `:?`
      # deliberately: a box that never configured mail must still come up.
      HERALDYX_TO: ${ALERT_TO:-}
      HERALDYX_SMTP_HOST: ${SMTP_HOST:-}
      HERALDYX_SMTP_FROM: ${SMTP_FROM:-}
      HERALDYX_SMTP_USER: ${SMTP_USER:-}
      HERALDYX_SMTP_PASS: ${SMTP_PASS:-}
      # Where the ONE link in an alert points. Sending mail needs none of this:
      # the notifier dials outward and the tunnel exists to let an operator in,
      # so alerts arrive on a box with no tunnel at all. What the tunnel decides
      # is whether the link in them can be opened.
      #
      # So it is settable. `CONSOLE_DOMAIN` is right for an operator who reaches
      # the console through the WireGuard tunnel, and it is the default because
      # that is the documented way in. An operator who uses `ssh -L` instead
      # (which install.sh offers, and which needs nothing) sets
      # ALERT_CONSOLE_URL=http://localhost:17420 in .env and their links work.
      # Empty in both is also an answer: the mail then says it carries no link
      # rather than carrying a dead one.
      HERALDYX_CONSOLE_URL: ${ALERT_CONSOLE_URL:-https://${CONSOLE_DOMAIN:-console.genaryx.internal}}
      HERALDYX_BOX: ${CONSOLE_DOMAIN:-agent stack}
    volumes:
      - events:/var/lib/stack/events:ro
      - heraldyxstate:/var/lib/stack/heraldyx
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- egress: the web enforcement point ------------------------------------
  #
  # OPT-IN, and the only service here that is. `docker compose up` does not
  # start it; `docker compose --profile egress up -d` does.
  #
  # heraldyx opens three mail ports. This one, once running, lets agents reach
  # the public web on 80 and 443, which is the widest grant on this box. An
  # installer that switched it on unasked would decide the one thing an operator
  # most needs to have chosen. The credential and the cap are already in .env,
  # so turning it on is one flag and no configuration.
  #
  # It refuses to start without SCOPYX_KEYS, which install.sh generates: a wide
  # bind with no credential is an unauthenticated fetch proxy on this box, and
  # anything reaching the port could fetch under the operator's allowance and
  # with their name on the record.
  scopyx:
    <<: *restart
    profiles: ["egress"]
    image: stack/scopyx:dev
    user: "65532:65532"
    environment:
      # Inside the compose network, not on the host. Nothing publishes a port
      # for this: the gateway and the console reach it by service name, and an
      # operator who wants to drive it by hand does so through them or with
      # `docker compose exec`.
      SCOPYX_ADDR: 0.0.0.0:4300
      SCOPYX_WARDRYX: http://wardryx:8090
      # `:-` and NOT `:?`, and this is not a relaxation.
      #
      # Compose interpolates every service in the file, INCLUDING ones whose
      # profile is off. With `:?` here, a box that updated compose.yaml without
      # re-running install.sh would fail to start ANYTHING, with an error naming
      # a service the operator never enabled. Measured 2026-08-09 by removing
      # both variables from a .env and running `docker compose config` with the
      # profile off: it refuses the whole file.
      #
      # Empty is safe because scopyx itself refuses to start without
      # SCOPYX_KEYS: a wide bind with no credential is an unauthenticated fetch
      # proxy, and it says so and exits. The failure stays inside the service
      # that was opted into, with a message that explains itself, instead of
      # taking the box down.
      SCOPYX_WARDRYX_KEY: ${SCOPYX_WARDRYX_KEY:-}
      SCOPYX_KEYS: ${SCOPYX_KEYS:-}
      # Its OWN journal, on its own volume, never the shared events volume. A
      # component that can write the shared log can, once compromised, corrupt
      # the trail it was adding to, and this is the only service here that
      # reaches the public internet on purpose.
      SCOPYX_EVENTS: /var/lib/scopyx/events.ndjson
      # No vendor, no account, no token. An operator who already runs a fetching
      # service sets SCOPYX_BACKEND=external and SCOPYX_EXTERNAL_ENDPOINT
      # instead, and gains a decision, a bound and a record over the tool they
      # already own.
      SCOPYX_BACKEND: ${SCOPYX_BACKEND:-passthrough}
      SCOPYX_EXTERNAL_ENDPOINT: ${SCOPYX_EXTERNAL_ENDPOINT:-}
      SCOPYX_EXTERNAL_KEY: ${SCOPYX_EXTERNAL_KEY:-}
      SCOPYX_MAX_FETCHES_PER_HOUR: ${SCOPYX_MAX_FETCHES_PER_HOUR:-200}
    volumes:
      - scopyxevents:/var/lib/scopyx
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- egress, with a browser ----------------------------------------------
  #
  # The same service, the same policy plane, the same journal volume, and one
  # difference: an image with Chromium in it, which is about 1 GB against the
  # 15 MB of the one above. That ratio is why this is a second profile rather
  # than a flag on the first: a box that wanted a governed fetcher should not
  # get a browser because somebody set a variable.
  #
  # `--profile egress-browser` INSTEAD OF `--profile egress`, never both: they
  # bind the same name in the compose network, and running both would give the
  # gateway two services called scopyx and no way to say which one it reached.
  scopyx-browser:
    <<: *restart
    profiles: ["egress-browser"]
    image: stack/scopyx-browser:dev
    user: "65532:65532"
    # The name the rest of the box reaches it by. Same as the profile above, so
    # nothing else in this file changes when an operator switches profiles.
    networks:
      default:
        aliases: ["scopyx"]
    environment:
      SCOPYX_ADDR: 0.0.0.0:4300
      SCOPYX_WARDRYX: http://wardryx:8090
      SCOPYX_WARDRYX_KEY: ${SCOPYX_WARDRYX_KEY:-}
      SCOPYX_KEYS: ${SCOPYX_KEYS:-}
      SCOPYX_EVENTS: /var/lib/scopyx/events.ndjson
      SCOPYX_BACKEND: chromium
      SCOPYX_MAX_FETCHES_PER_HOUR: ${SCOPYX_MAX_FETCHES_PER_HOUR:-200}
      # NOT set here, and the omission is the decision.
      #
      # Chromium ships with its renderer sandbox on. In a container that cannot
      # give it the user namespaces it needs, it refuses to start and says so,
      # and the operator then chooses which sandbox to keep. The two ways out
      # are below, and this file takes the one that keeps CHROME's, because
      # with that off a renderer exploit runs as this container's user and can
      # open sockets directly: egress that never passes the proxy and never
      # appears in the record. The container's seccomp filter protects the host
      # from the container; it does not protect the record from a compromised
      # renderer.
      #
      #   SCOPYX_CHROMIUM_NO_SANDBOX: "1"   # keeps the container's filter
      #
    # Chrome's sandbox needs syscalls the default profile refuses. Measured
    # 2026-08-10: with the default profile the browser refuses to start and
    # names the sandbox; with this line it renders a live page.
    security_opt:
      - seccomp:unconfined
    # A browser writes: a profile directory per fetch, and its own temporary
    # files. Both land here, both are wiped with the container, and neither
    # touches a named volume, because a profile that outlived a fetch is
    # invariant 4 broken by storage rather than by code.
    tmpfs:
      - /tmp:size=512m
    volumes:
      - scopyxevents:/var/lib/scopyx
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- money: the control API ----------------------------------------------
  tokenfuse-cloud:
    <<: *restart
    image: stack/tokenfuse:dev
    command: ["/usr/local/bin/tokenfuse-cloud"]
    environment:
      PORT: "8080"
      # The binary binds loopback by default, which inside a container means
      # nothing else can reach it. Bind the container's own address instead.
      TOKENFUSE_CLOUD_HOST: 0.0.0.0
      TOKENFUSE_CLOUD_KEYS: ${CLOUD_KEYS:?set by install.sh}
      TOKENFUSE_CLOUD_DATA: /var/lib/stack/cloud/state.json
    volumes:
      - events:/var/lib/stack/events
      - cloudstate:/var/lib/stack/cloud
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- money: the enforcing proxy ------------------------------------------
  # The one service published to a host port at all, because it is the one
  # agents elsewhere call. WHICH host address it lands on is the operator's
  # decision: `GATEWAY_BIND` in .env, loopback unless they said otherwise.
  # Everything it does is metered, and an over-budget or policy-denied call
  # gets a hard refusal rather than a log line.
  tokenfuse-gateway:
    <<: *restart
    image: stack/tokenfuse:dev
    command: ["/usr/local/bin/tokenfuse-gateway"]
    environment:
      TOKENFUSE_ADDR: 0.0.0.0:4100
      TOKENFUSE_MODE: enforce
      TOKENFUSE_DATA_DIR: /var/lib/stack/traces/gateway
      TOKENFUSE_UPSTREAM: https://api.anthropic.com/v1/messages
      TOKENFUSE_CLOUD_URL: http://tokenfuse-cloud:8080
      TOKENFUSE_CLOUD_KEY: ${CLOUD_ADMIN:?set by install.sh}
      TOKENFUSE_WARDRYX_MODE: enforce
      TOKENFUSE_WARDRYX_URL: http://wardryx:8090
      TOKENFUSE_WARDRYX_KEY: ${WARDRYX_GATEWAY:?set by install.sh}
      # closed, not open: if the policy plane cannot answer, the call is
      # refused. An enforcement point that fails open is a log with extra steps.
      TOKENFUSE_WARDRYX_FAILMODE: closed
      TOKENFUSE_WARDRYX_TIMEOUT_MS: "250"
      TOKENFUSE_WARDRYX_CACHE_TTL_MS: "3000"
    ports:
      # Loopback if the variable is absent, matching install.sh. The fallback
      # matters on its own: someone running `docker compose up` by hand
      # without an .env would otherwise publish an enforcement plane to every
      # interface because a variable was unset, which is the wrong direction
      # for a default to fail in.
      - "${GATEWAY_BIND:-127.0.0.1}:4100:4100"
    volumes:
      - events:/var/lib/stack/events
      - traces:/var/lib/stack/traces
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      tokenfuse-cloud:
        condition: service_started
      wardryx:
        condition: service_started

  # ---- the console ---------------------------------------------------------
  # Loopback only. It arrives over the operator's own tunnel, never off the
  # open internet, which is the same posture the cluster deployment takes.
  # ---- the operator's road in ----------------------------------------------
  # A WireGuard server for the humans who run this box. Deliberately its own
  # container: it needs NET_ADMIN and a tun device, and the console must not.
  # The console manages peers over the UAPI socket on the shared `wgapi`
  # volume, holding no capability of its own.
  wg:
    <<: *restart
    image: stack/wg:dev
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      WG_IFACE: ${WG_IFACE:-wg-op}
      WG_LISTEN_PORT: "${WG_LISTEN_PORT:-51820}"
      # The uid the console image runs as, so the socket is reachable by it
      # and by nothing else on the volume.
      WG_SOCKET_GID: "10001"
      # The tunnel leads to TLS, not to the console directly. The console is
      # still plain HTTP on its own port, reachable only from inside this
      # compose network - Caddy is what a device in the tunnel talks to, and
      # what makes the passkey ceremony possible at all.
      WG_CONSOLE_HOST: caddy
      WG_CONSOLE_PORT: "443"
    ports:
      # Published on purpose, and the one port here that has to be: a tunnel
      # nobody can dial is not a tunnel. Unlike the gateway, WireGuard answers
      # nothing at all without a valid key - no banner, no handshake, no
      # response to a scan - which is exactly why it is the road in rather
      # than an exposed HTTP plane.
      - "${WG_BIND:-0.0.0.0}:${WG_LISTEN_PORT:-51820}:${WG_LISTEN_PORT:-51820}/udp"
    volumes:
      - wgstate:/var/lib/wireguard
      - wgapi:/var/run/wireguard

  # ---- TLS for the console, inside the tunnel ------------------------------
  # Not a way in from the internet: this listens on the TUNNEL address only,
  # and exists because WebAuthn refuses to run without a secure context and
  # refuses a bare IP as the relying party. Without it the passkey ceremony
  # simply cannot happen over WireGuard, on any device.
  caddy:
    <<: *restart
    image: stack/caddy:dev
    environment:
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:?set by install.sh}
      CONSOLE_UPSTREAM: console:7420
      # Present -> a real Let's Encrypt certificate over DNS-01. Absent ->
      # Caddy's internal CA, which works only on devices told to trust it.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      console:
        condition: service_started

  console:
    <<: *restart
    image: stack/genaryx-console:dev
    environment:
      HOME: /var/lib/stack
      TAIPAN_HOME: /etc/genaryx/taipan
      GENARYX_SCAN_TARGET: /srv/ui
      GENARYX_COPILOT_PROVIDER: ollama
      TOKENFUSE_CLOUD_URL: http://tokenfuse-cloud:8080
      # ADMIN_KEY, not CLOUD_KEY. `TOKENFUSE_CLOUD_KEY` is the name the GATEWAY
      # reads; the console's money plane looks for `TOKENFUSE_CLOUD_ADMIN_KEY`
      # and finds nothing under the other spelling, so every install came up
      # with an Overview that said "No environment found" while a perfectly
      # healthy Cloud sat one container away. The policy plane below was right
      # all along, which is what made the difference easy to miss.
      TOKENFUSE_CLOUD_ADMIN_KEY: ${CLOUD_ADMIN:?set by install.sh}
      WARDRYX_URL: http://wardryx:8090
      WARDRYX_ADMIN_KEY: ${WARDRYX_ADMIN:?set by install.sh}
      GENARYX_WG_IFACE: ${WG_IFACE:-wg-op}
      # The RELAY socket, not the daemon's own: wireguard-go requires its socket
      # to stay 0700 and stops answering if that changes, so the wg container
      # forwards a group-readable one to it.
      GENARYX_WG_UAPI_SOCKET: /var/run/wireguard/console.sock
      # The address a phone dials from outside. Nothing on the interface can
      # report it, so the installer writes it and the console refuses to guess.
      GENARYX_WG_ENDPOINT_HOST: ${WG_ENDPOINT_HOST:?set by install.sh}
      # WebAuthn binds credentials to this exact pair. It must match what the
      # browser addresses through Caddy, or every assertion is refused with a
      # mismatch that reads like a broken passkey rather than a wrong origin.
      GENARYX_WEB_RP_ID: ${CONSOLE_DOMAIN:?set by install.sh}
      GENARYX_WEB_ORIGIN: https://${CONSOLE_DOMAIN:?set by install.sh}
    ports:
      - "127.0.0.1:7420:7420"
    volumes:
      - consolestate:/var/lib/stack
      - events:/var/lib/stack/events
      - ./environments:/etc/genaryx/taipan/environments:ro
      - wgapi:/var/run/wireguard
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      tokenfuse-cloud:
        condition: service_started
      wardryx:
        condition: service_started
      idryx:
        condition: service_started

  # ---- record: the tamper-evident store of what this box did ----------------
  #
  # Off unless asked for, like the egress plane above. `docker compose up -d`
  # does not start it; `docker compose --profile record up -d record-seal`
  # does, and `WITH_RECORD=1 ./install.sh` is what builds its image.
  #
  # The bus and the record are two different things and this is the seam
  # between them. `events` is a BUS: four components append to it, anything may
  # read it, and an operator clearing space deletes from it. This writes a
  # hash-chained STORE of sealed segments with one cursor per source file, and
  # it lives on its OWN volume for exactly that reason. A record kept inside
  # the volume its own inputs live in is evidence an operator can delete while
  # tidying up the thing it is evidence about.
  #
  # One container running one loop, rather than a timer, because compose has no
  # cron and because the store takes no cross-process lock: a second writer
  # would be two minters of one shard. The cluster gets the same property from
  # `concurrencyPolicy: Forbid` on its CronJob. Serial here is structural, not
  # a promise.
  record-seal:
    <<: *restart
    image: stack/trailryx:dev
    user: "10001:10001"
    profiles: ["record"]
    environment:
      # Deliberately invalid, exactly as the cluster's ConfigMap is. This is
      # the one value nobody else can supply: unlike stack-up, which mints its
      # own demo fleet, this deployment governs whatever fleet an operator
      # points at it, so nothing here knows the domain their agents mint under.
      #
      # A wrong value used to be worse than a missing one. `--trust-domain`
      # takes ONE value, every non-matching line is refused, and the cursor
      # committed the position it reached even when nothing was stored, so one
      # pass under the wrong domain put those events permanently outside the
      # record and the next pass answered "nothing new". trailryx holds the
      # cursor for that case since 2026-08-27 and has two tests on it, so the
      # loss path is closed at the source. The refusal below is still here
      # because being told beats being silently correct.
      RECORD_TRUST_DOMAIN: ${RECORD_TRUST_DOMAIN:-set-me.invalid}
      # Daily, like the cluster's 05:27 and stack-up's 06:57. Settable so a
      # box under test does not wait a day to show it works.
      RECORD_SEAL_INTERVAL: ${RECORD_SEAL_INTERVAL:-86400}
    command:
      - /bin/sh
      - -c
      - |
        set -u
        events=/var/lib/stack/events
        data=/var/lib/stack/records
        while :; do
          # REFUSE BEFORE CONSUMING. The check reads the agent ids already on
          # the bus against the domain about to be passed, and refuses only
          # when NOTHING matches: a partial match is a normal state for a box
          # governing more than one domain, and `--trust-domain` takes one.
          seen=0; matched=0
          for f in "$$events"/*.ndjson; do
            [ -e "$$f" ] || continue
            # `n=$$(grep -c ...) || n=0` and NOT `... || echo 0`. grep -c
            # prints 0 AND exits 1 when it matches nothing, so the `echo`
            # form appends a second zero and the arithmetic below dies with
            # "syntax error in expression". Under `set -u` without `set -e`
            # the loop then carries on and seals anyway, so the refusal this
            # whole block exists for would never have fired. Found by running
            # the script, not by reading it.
            # `grep -E` with optional whitespace, not a fixed string. The
            # first version matched `"agent_id":"agent://` exactly and
            # refused a bus whose writer had put a space after the colon,
            # reporting 20 ids seen and 0 matched on ids that all matched.
            # Every producer in this estate is Go or Rust and writes compact
            # JSON, so this would have held here and broken for the first
            # producer that did not. Found by running the real image against
            # a real bus, not by reading it.
            n=$$(grep -cE '"agent_id"[[:space:]]*:' "$$f" 2>/dev/null) || n=0
            m=$$(grep -cE "\"agent_id\"[[:space:]]*:[[:space:]]*\"agent://$$RECORD_TRUST_DOMAIN/" "$$f" 2>/dev/null) || m=0
            seen=$$((seen + n)); matched=$$((matched + m))
          done
          if [ "$$seen" -gt 0 ] && [ "$$matched" -eq 0 ]; then
            echo "refusing before importing: none of the $$seen agent id(s) on the bus is under" >&2
            echo "  agent://$$RECORD_TRUST_DOMAIN/ , so this would seal nothing and say it worked." >&2
            echo "  Set RECORD_TRUST_DOMAIN in .env to the domain your agents mint under." >&2
            sleep "$$RECORD_SEAL_INTERVAL"; continue
          fi
          sealed=0
          for f in "$$events"/*.ndjson; do
            [ -e "$$f" ] || continue
            # Best-effort per file, like the cluster's job and stack-up's
            # routine: one unreadable file is that file's problem, not a reason
            # to leave every other file's new events unsealed.
            trailryx-node events --file "$$f" --data "$$data" \
              --trust-domain "$$RECORD_TRUST_DOMAIN" --seal-records 500 || true
            sealed=$$((sealed + 1))
          done
          if [ "$$sealed" -eq 0 ]; then
            echo "no event files in $$events yet; nothing to seal"
          else
            pack="$$data/pack-$$(date -u +%Y%m%dT%H%M%SZ).pack"
            if trailryx-node read --data "$$data" --all --pack "$$pack"; then
              # Verified before the loop sleeps. A pack that does not verify is
              # the one thing that makes this loud, which is the record plane's
              # own discipline: a refused line is counted and reported and is
              # not an error.
              trailryx-verify "$$pack" || echo "PACK DID NOT VERIFY: $$pack" >&2
            else
              echo "nothing sealed here to pack yet"
            fi
          fi
          sleep "$$RECORD_SEAL_INTERVAL"
        done
    volumes:
      # Read only. This is a reader of the bus and a writer of the record, and
      # the mount says so rather than the code being trusted to.
      - events:/var/lib/stack/events:ro
      - records:/var/lib/stack/records
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- routines: the scheduled half, which this deployment did not have ------
  #
  # Off unless asked for: `docker compose --profile routines up -d`.
  #
  # THE GAP THIS CLOSES. stack-up runs five governance routines on a timer and
  # stack-k8s runs four as CronJobs. This deployment installed NO scheduler of
  # any kind, so the planes came up and the work that keeps them producing did
  # not happen. estate-gates recorded that as six divergences from 2026-08-06,
  # and it is the single-box install, the one most likely to be somebody's first
  # look at the estate.
  #
  # WHY THEY ARE LOOPS AND NOT TIMERS. compose has no cron, which is the same
  # reason `record-seal` above is a service rather than a job. Each of these
  # sleeps, runs once, prints, and sleeps again; the artifact is the log, which
  # is what stack-k8s's quality-drift does too.
  #
  # THREE OF THE FIVE, AND THE OTHER TWO ARE SAID OUT LOUD RATHER THAN QUIETLY
  # LEFT OUT:
  #
  #   qryx-trend     scans a SOURCE TREE. stack-up points it at its own
  #                  checkout of the estate's repositories. There is no source
  #                  tree in these containers and mounting the operator's disk
  #                  into a governance plane to look for crypto is a bigger
  #                  decision than a missing routine.
  #   mockryx-drill  needs the scenario files, which live in the mockryx
  #                  repository and are not in this image, and it is opt-in in
  #                  both other deployments anyway.
  #
  # The sixth, trailryx-seal, is the `record` profile above.
  focus-export:
    <<: *restart
    image: stack/tokenfuse:dev
    user: "10001:10001"
    profiles: ["routines"]
    environment:
      ROUTINE_INTERVAL: ${ROUTINE_INTERVAL:-3600}
    command:
      - /bin/sh
      - -c
      - |
        set -u
        traces=/var/lib/stack/traces/gateway
        out=/var/lib/stack/focus
        sleep "$$ROUTINE_INTERVAL"
        while :; do
          if [ ! -d "$$traces" ]; then
            echo "focus-export: no trace directory at $$traces yet"
          elif tokenfuse-gateway focus-export --traces "$$traces" \
                 --out "$$out/focus-$$(date -u +%Y%m%dT%H%M%SZ).csv" 2>&1; then
            echo "focus-export: wrote a window"
          else
            # An idle window exits non-zero with "no calls found in the trace",
            # which is not a failure of the export. stack-up's routine makes the
            # same judgement.
            echo "focus-export: nothing to export in this window"
          fi
          sleep "$$ROUTINE_INTERVAL"
        done
    volumes:
      # Read only. It reads what the gateway wrote and must not be able to edit
      # it, the same split the record profile makes over the bus.
      - traces:/var/lib/stack/traces:ro
      - focus:/var/lib/stack/focus
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  idryx-detect:
    <<: *restart
    image: stack/idryx:dev
    user: "10001:10001"
    profiles: ["routines"]
    environment:
      ROUTINE_INTERVAL: ${ROUTINE_INTERVAL:-3600}
    command:
      - /bin/sh
      - -c
      - |
        set -u
        bus=/var/lib/stack/events/tokenfuse.ndjson
        sleep "$$ROUTINE_INTERVAL"
        while :; do
          if [ ! -s "$$bus" ]; then
            echo "idryx-detect: the bus at $$bus is empty, nothing to detect on"
          else
            idryx detect --load "tokenfuse:$$bus" --format human 2>&1 || true
          fi
          sleep "$$ROUTINE_INTERVAL"
        done
    volumes:
      - events:/var/lib/stack/events:ro
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  verdryx-drift:
    <<: *restart
    image: stack/genaryx-console:dev
    user: "10001:10001"
    profiles: ["routines"]
    environment:
      ROUTINE_INTERVAL: ${ROUTINE_INTERVAL:-3600}
      # Empty means "skip", which is the honest default: a drift check needs a
      # baseline somebody chose, and inventing one would compare against a
      # number nobody stands behind. stack-up's routine skips for the same
      # reason and says so.
      ROUTINE_VERDRYX_BASELINE: ${ROUTINE_VERDRYX_BASELINE:-}
    command:
      - /bin/sh
      - -c
      - |
        set -u
        db=/var/lib/stack/.taipan/verdryx.db
        sleep "$$ROUTINE_INTERVAL"
        while :; do
          if [ -z "$$ROUTINE_VERDRYX_BASELINE" ]; then
            echo "verdryx-drift: skipped, ROUTINE_VERDRYX_BASELINE is not set in .env"
          elif [ ! -f "$$db" ]; then
            echo "verdryx-drift: skipped, no store at $$db (no verdryx eval has run here)"
          else
            VERDRYX_DB="$$db" verdryx drift --baseline "$$ROUTINE_VERDRYX_BASELINE" 2>&1 || true
          fi
          sleep "$$ROUTINE_INTERVAL"
        done
    volumes:
      - consolestate:/var/lib/stack:ro
    depends_on:
      init-volumes:
        condition: service_completed_successfully

volumes:
  # The shared event log the planes couple through. One machine, so this is
  # simply a volume: the cluster needed a ReadWriteMany class and a storage
  # provider to get the same thing.
  events:
  traces:
  cloudstate:
  consolestate:
  pgdata:
  # How far the notifier has read, and what it has already said. On a volume
  # because losing either means re-reading the log and re-sending alerts that
  # already went out, which on a restart loop is a mailbox full of one
  # incident.
  # scopyx's own journal, deliberately NOT the shared `events` volume above.
  scopyxevents:
  heraldyxstate:
  # The record plane's store, deliberately NOT the shared `events` volume:
  # a hash-chained record kept inside the volume its own inputs live in is
  # evidence an operator can delete while clearing space on the bus.
  # focus-export's own output, so it never writes into the trace directory it
  # reads. Its artifact is the log line; the CSV is a convenience.
  focus:
  records:
  # The WireGuard server's own key. On a volume because regenerating it would
  # invalidate every device config ever issued, silently.
  wgstate:
  # Caddy's certificates and its ACME account key. On a volume because losing
  # them means re-issuing on every restart, and Let's Encrypt rate-limits that.
  caddydata:
  caddyconfig:
  # The UAPI socket the console manages peers through. This volume IS the
  # privilege boundary: the tunnel and NET_ADMIN live in the `wg` container,
  # and the console reaches them through one group-readable unix socket.
  wgapi:
