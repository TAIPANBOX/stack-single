# The agent stack on one machine, for real use rather than a local try.
#
# This is the same wiring `stack-k8s` proved on a five-node cluster, minus
# Kubernetes: same images, same environment variables, same ports, same
# failure modes. Docker's own DNS resolves service names exactly the way
# Kubernetes Services did, so `http://wardryx:8090` means the same thing in
# both, and nothing had to be rewritten to move between them.
#
# What is deliberately NOT published to the host:
#   cloud (8080), wardryx (8090), idryx (8081) and postgres (5432) have no
#   `ports:` at all. They are reachable only from inside this compose network,
#   which is the single-box equivalent of the cluster's default-deny
#   NetworkPolicy. The gateway is the one service agents elsewhere must reach,
#   and the console is bound to loopback so it arrives over the operator's own
#   tunnel rather than off the open internet. scopyx, typryx and vouchryx, all
#   opt-in, join that same closed set: none of them publishes a port either.
#   tokenfuse's MCP broker (opt-in too, `typed` profile) is the exception among
#   them: it does publish, on `${GATEWAY_BIND:-127.0.0.1}:4200`, the identical
#   expression the gateway's own port uses, so it inherits the same
#   closed-by-default posture rather than a second one to keep in sync.
#
# Secrets come from `.env`, which `install.sh` generates with 0600 and never
# commits. Nothing here has a default credential.

name: agent-stack

x-restart: &restart
  restart: unless-stopped

services:
  # ---- one-shot: make the shared volumes writable --------------------------
  # Kubernetes has `fsGroup` for exactly this and Compose has no equivalent, so
  # this is the equivalent, written out. A fresh Docker named volume is created
  # root:root 0755 unless the image already contains that path, and every
  # service here runs as a non-root user, so without this the policy plane
  # crash-loops on "permission denied" writing its own event file and the
  # gateway drops every trace with a WARN nobody reads. The cluster never
  # showed this because its RWX volume came from a provisioner that hands out
  # a permissive share; a local volume does not.
  #
  # Two UID families share the event log: the Go planes are 65532 (distroless
  # nonroot) and the Rust and Python ones are 10001. So the directory is owned
  # by GROUP 10001 with the setgid bit, both families run with that GID, and
  # every file created inside inherits it. No writer ever needs write access to
  # another's file: each plane appends only to its own.
  init-volumes:
    image: busybox:1.36
    user: "0:0"
    command:
      - sh
      - -euc
      - |
        mkdir -p /vol/events /vol/traces /vol/cloud /vol/heraldyx /vol/records /vol/scopyx /vol/focus /vol/typryx /vol/vouchryx /vol/conform
        chown 0:10001 /vol/events && chmod 2775 /vol/events
        chown 10001:10001 /vol/traces /vol/cloud && chmod 0775 /vol/traces /vol/cloud
        # The notifier runs 65532:10001 like the Go planes, and writes exactly
        # one file here. Same trap as the others: a fresh named volume is
        # root:root 0755, and without this line the process starts, reads the
        # log, decides correctly and then cannot save what it decided, so
        # every restart re-sends what it already sent.
        chown 65532:10001 /vol/heraldyx && chmod 0775 /vol/heraldyx
        # The record plane runs 10001:10001 and is the only writer here.
        # Same trap as the others: a fresh named volume is root:root 0755,
        # so without this the seal starts, reads the bus, and cannot write
        # what it read.
        chown 10001:10001 /vol/records && chmod 0775 /vol/records
        # scopyx (profile egress) runs 65532:65532 and keeps its own journal
        # here. Until 2026-09-13 neither this volume nor `records` above was
        # mounted into this container, so the two chowns landed on this
        # container's own filesystem and the profiles crash-looped
        # (scopyx) or sealed nothing with a running container (record-seal)
        # on every fresh box. `bus-has-a-writer.sh` now requires every
        # volume a non-root service writes to be mounted AND owned here.
        chown 65532:65532 /vol/scopyx && chmod 0775 /vol/scopyx
        # typryx (profile typed) runs 65532:65532 and keeps its own journal and
        # ledger here, the same reasoning as scopyx above: a fresh named volume
        # is root:root 0755, so without this chown the plane crash-loops on
        # "permission denied" the moment it is started.
        chown 65532:65532 /vol/typryx && chmod 0775 /vol/typryx
        # vouchryx (profile delegation) runs 65532:10001, the same pair every
        # other Go plane's bus writer uses, and keeps its own revocation store
        # here (VOUCHRYX_REVOCATIONS_PATH), deliberately not the shared events
        # volume: a revocation is not an agent event, and it must survive a
        # `docker compose down` the same way pgdata and wgstate already do.
        # Same trap as every other named volume in this loop: root:root 0755
        # by default, and without this chown the plane refuses to start rather
        # than run with a revocation list nobody can prove survived a restart.
        chown 65532:10001 /vol/vouchryx && chmod 0775 /vol/vouchryx
        # focus-export (profile routines) runs 10001:10001 and writes the FOCUS
        # CSVs here; found by the gate the day it was written, same trap.
        chown 10001:10001 /vol/focus && chmod 0775 /vol/focus
        # idryx is told to load the gateway's log at startup and exits if the
        # file is absent, which on a box that has served no traffic yet it
        # always is. An empty file is a valid empty log, and pre-creating it is
        # the difference between "no events yet" and a crash loop.
        #
        # The money plane's two files are pre-created for a second reason as
        # well: the tokenfuse images run as uid 10001 with gid 999 (`useradd
        # -r` with no matching group), so against this directory's root:10001
        # 2775 neither the gateway nor the control plane can CREATE a file
        # here, and the exporter swallows the open error. Owned by that uid,
        # an existing file is theirs to append to. The control plane's was
        # missing until 2026-09-17 (#57): budget_exhausted and the other
        # Cloud detectors stayed inside /v1/incidents, invisible to the
        # notifier and the record. `bus-has-a-writer.sh` holds both names.
        #
        # Two more join this loop 2026-09-26, for the typed plane (profile
        # typed). typryx runs 65532:10001, the same group every other Go
        # plane's bus writer uses, so it could create its own file through
        # that group; pre-created anyway, so a box that never enables the
        # typed profile still has an empty file here rather than nothing, the
        # same as every other name in this loop. tokenfuse's MCP broker is
        # the tokenfuse image again, uid 10001 gid 999, so it needs this the
        # way the gateway and the control plane do: it cannot create here on
        # its own. Each names its own file, never another writer's, for the
        # one-appender-per-file reason above. heraldyx reads this whole
        # directory, so it can now alert on typryx's own events; record-seal
        # reads it too and counts typryx's four event types refused rather than
        # sealing them: they carry agent-event v1.0, which trailryx 1.0 does
        # not read (unknown_schema, measured on stack-up 2026-09-26), and past
        # the schema its mapper refuses all four by name on purpose
        # (trailryx#81: an answer to a question is not a decision the agent
        # took).
        for f in tokenfuse.ndjson tokenfuse-cloud.ndjson tokenfuse-mcp.ndjson wardryx.ndjson typryx.ndjson vouchryx.ndjson; do
          [ -e "/vol/events/$$f" ] || : > "/vol/events/$$f"
          chown 10001:10001 "/vol/events/$$f" && chmod 0664 "/vol/events/$$f"
        done
        # The chain verifier (agent-conform) runs 10002:10002, NEITHER of the
        # bus's uid families and NOT in the bus group on purpose: this
        # directory is root:10001 2775, so a process outside group 10001 cannot
        # create a file here and cannot write any other plane's (they are 0664
        # owned by 10001). The one file it may write is its own stream, so it
        # is created here, empty, and given to it alone. Its memory (which
        # breaks it has already announced) is on its own volume, not on the
        # bus: a state file inside the directory it verifies would be read as
        # a stream, and an operator clearing the bus would delete it and
        # re-send every alert. `chain-verifier-is-contained.sh` holds all of
        # this.
        [ -e /vol/events/agent-conform.ndjson ] || : > /vol/events/agent-conform.ndjson
        chown 10002:10002 /vol/events/agent-conform.ndjson && chmod 0644 /vol/events/agent-conform.ndjson
        chown 10002:10002 /vol/conform && chmod 0775 /vol/conform
        echo "volumes ready"
    volumes:
      - events:/vol/events
      - traces:/vol/traces
      - cloudstate:/vol/cloud
      - heraldyxstate:/vol/heraldyx
      - records:/vol/records
      - scopyxevents:/vol/scopyx
      - focus:/vol/focus
      - typryxdata:/vol/typryx
      - vouchryxdata:/vol/vouchryx
      - conformstate:/vol/conform
    restart: "no"

  # ---- the policy plane's durable store ------------------------------------
  # Every console-block policy and the whole approval trail lives here, so a
  # restart must not forget what the fleet is forbidden to do.
  policy-db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wardryx
      POSTGRES_USER: wardryx
      POSTGRES_PASSWORD: ${POLICY_DB_PASSWORD:?set by install.sh}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardryx -d wardryx"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- policy --------------------------------------------------------------
  wardryx:
    <<: *restart
    image: ${WARDRYX_IMAGE:-ghcr.io/taipanbox/wardryx:v1.2.0}
    # The image's own 65532:65532, with the GID moved to the one that owns the
    # shared event directory. The binary is a static Go binary and reads no
    # /etc/passwd, so a numeric pair it was not built with is fine.
    user: "65532:10001"
    command:
      - serve
      - -addr
      - 0.0.0.0:8090
      - -events
      - /var/lib/stack/events/wardryx.ndjson
      - -policy
      - /etc/wardryx/policy.yaml
    environment:
      WARDRYX_KEYS: ${WARDRYX_KEYS:?set by install.sh}
      # WARDRYX_DB, not WARDRYX_DSN. wardryx reads WARDRYX_DB
      # (internal/config/config.go) and has never read WARDRYX_DSN, so this
      # compose generated a correct DSN, waited for policy-db to be healthy,
      # and then handed the value over under a name the binary ignores. The
      # effect is the one stack-k8s spells out in its own manifest: with no
      # DB, wardryx keeps policy AND approvals in memory, so a restart
      # silently drops every console-written policy and unfreezes the fleet
      # while the console still shows it stopped.
      WARDRYX_DB: ${POLICY_DB_DSN:?set by install.sh}
      WARDRYX_APPROVAL_SECRET: ${APPROVAL_SECRET:?set by install.sh}
      # Every policy set this wardryx makes effective, kept under its own
      # policy_version, on the events volume that is already here. No new
      # volume and no new storage: a policy set is kilobytes and the archive
      # is content-addressed, so the same set is kept once however often it
      # is loaded.
      #
      # Unset, wardryx serves exactly as before and loses one thing: the
      # policy store is a live control surface where writes overwrite and
      # deletes remove, so the rules a recorded decision names are gone at
      # the next policy write and `wardryx replay` can examine none of them.
      # The loss is one-way, which is why this is set now rather than when
      # somebody first wants a replay: it works forward from this day only.
      WARDRYX_POLICY_ARCHIVE: /var/lib/stack/events/wardryx-policy-archive
    volumes:
      - events:/var/lib/stack/events
      - ./policy.yaml:/etc/wardryx/policy.yaml:ro
    # `default` as before, plus the one extra network the typed risk signal
    # uses (see `typryx-wardryx-proxy` below). Joining it costs nothing while
    # the proxy is not running: the network then holds wardryx alone.
    networks:
      - default
      - risk-signal
    depends_on:
      policy-db:
        condition: service_healthy
      init-volumes:
        condition: service_completed_successfully

  # ---- identity ------------------------------------------------------------
  # Read-only on the event log: idryx builds its graph FROM it and never
  # writes, and the mount says so.
  idryx:
    <<: *restart
    image: ${IDRYX_IMAGE:-ghcr.io/taipanbox/idryx:v1.1.0}
    user: "65532:10001"
    command:
      - serve
      - --addr
      - 0.0.0.0:8081
      - --load
      - tokenfuse:/var/lib/stack/events/tokenfuse.ndjson
    volumes:
      - events:/var/lib/stack/events:ro
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- the notifier: the part that writes to you ---------------------------
  # Reads the shared event log and mails the operator when one of their agents
  # crosses a line. It runs on every box, and on a box where nobody filled in
  # ALERT_TO it watches the log, stays healthy and sends nothing: not having
  # mail is a choice an operator makes, not a broken deployment.
  #
  # `:ro` on the event volume, like idryx above and for the same reason: this
  # process reads the log and can do nothing else to it. Every limit it applies
  # is a limit on messages, never on evidence.
  #
  # Unlike the cluster, a compose box cannot express "this container may reach
  # the mail ports and nothing else": Docker gives every container outbound
  # access and there is no NetworkPolicy here to narrow it. That difference is
  # real and is not hidden: on one machine the boundary is the machine.
  heraldyx:
    <<: *restart
    image: ${HERALDYX_IMAGE:-ghcr.io/taipanbox/heraldyx:v0.3.0}
    user: "65532:10001"
    environment:
      HERALDYX_EVENTS: /var/lib/stack/events
      HERALDYX_STATE: /var/lib/stack/heraldyx/state.json
      # "high", not stack-up's "medium": deliberately different, and
      # previously unstated anywhere. This is a real deployment governing
      # whatever fleet the operator actually points at it; stack-up is the
      # local sandbox meant to show a newcomer what an alert looks like
      # within a few minutes of ./up.sh. A "high" default here keeps a real
      # operator's inbox quiet until something serious happens; stack-up's
      # lower default gives its short demo something to show. Same
      # variable, opposite correct default, for two different audiences.
      # Overridable per box via ALERT_MIN_SEVERITY in .env.
      HERALDYX_MIN_SEVERITY: ${ALERT_MIN_SEVERITY:-high}
      # Empty is the default and means "send nothing". `:-` rather than `:?`
      # deliberately: a box that never configured mail must still come up.
      HERALDYX_TO: ${ALERT_TO:-}
      HERALDYX_SMTP_HOST: ${SMTP_HOST:-}
      HERALDYX_SMTP_FROM: ${SMTP_FROM:-}
      HERALDYX_SMTP_USER: ${SMTP_USER:-}
      HERALDYX_SMTP_PASS: ${SMTP_PASS:-}
      # Where the ONE link in an alert points. Sending mail needs none of this:
      # the notifier dials outward and the tunnel exists to let an operator in,
      # so alerts arrive on a box with no tunnel at all. What the tunnel decides
      # is whether the link in them can be opened.
      #
      # So it is settable. `CONSOLE_DOMAIN` is right for an operator who reaches
      # the console through the WireGuard tunnel, and it is the default because
      # that is the documented way in. An operator who uses `ssh -L` instead
      # (which install.sh offers, and which needs nothing) sets
      # ALERT_CONSOLE_URL=http://localhost:17420 in .env and their links work.
      # Empty in both is also an answer: the mail then says it carries no link
      # rather than carrying a dead one.
      HERALDYX_CONSOLE_URL: ${ALERT_CONSOLE_URL:-https://${CONSOLE_DOMAIN:-console.genaryx.internal}}
      HERALDYX_BOX: ${CONSOLE_DOMAIN:-agent stack}
    volumes:
      - events:/var/lib/stack/events:ro
      - heraldyxstate:/var/lib/stack/heraldyx
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- the chain verifier: the part that reads the bus back -----------------
  #
  # Every writer on the bus chains its lines (`prev_hash`), and until
  # agent-stack-go#66 nothing on a box ever checked. On the 2026-09-17
  # appliance run one byte flipped on a sealed line of this bus was seen by
  # nothing: the tool that finds it existed as source and release archives and
  # no launcher ran it. `agent-conform watch-dir` is that tool as a loop: every
  # five minutes it verifies the `prev_hash` chain of every `*.ndjson` in this
  # directory and, for a break it has not announced, appends ONE `chain_broken`
  # (high) event to its own stream, `agent-conform.ndjson`, where heraldyx
  # already reads. It is distroless with no shell, which is why `-every` exists
  # and why this is one container and not a script.
  #
  # ON BY DEFAULT, and that is a choice: it reads and writes only what is
  # named below, costs nothing metered, and a bus nobody verifies is the fault
  # this closes. A verifier that cannot do its job exits 2 and compose restarts
  # it, so a broken one shows as a restart count and not as a quiet box.
  #
  # WHAT IT MAY WRITE, AND HOW THAT IS ENFORCED. The bus is mounted read-write
  # because its own stream has to be on the bus for heraldyx to see it, and
  # compose cannot mount one file of a named volume. So the limit is the
  # account it runs as, not the mount: 10002:10002 is outside the bus group
  # (10001), the directory is root:10001 2775, and the other planes' files are
  # 0664 owned by 10001, so this uid can READ every stream through the "other"
  # bits and WRITE exactly one file, the one init-volumes pre-created and gave
  # it. No `group_add`, ever: the bus group would let it write every plane's
  # file. `-out` must be a file named agent-conform.ndjson (the tool refuses
  # any other name: that name is the source its events claim), and `-state` is
  # on its own volume, outside the directory it walks.
  #
  # NOT PROVEN BY THIS FILE: that a break on a LIVE bus is announced (the
  # first pass on a fresh box has only empty streams), and that record-seal,
  # which reads this stream too, has anything to say about its schema.
  agent-conform:
    <<: *restart
    image: ${AGENT_CONFORM_IMAGE:-ghcr.io/taipanbox/agent-conform:v1.1.0}
    user: "10002:10002"
    command:
      - watch-dir
      - -every
      - 5m
      - -out
      - /var/lib/stack/events/agent-conform.ndjson
      - -state
      - /var/lib/agent-conform/state.json
      - /var/lib/stack/events
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - events:/var/lib/stack/events
      - conformstate:/var/lib/agent-conform
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- egress: the web enforcement point ------------------------------------
  #
  # OPT-IN, and the only service here that is. `docker compose up` does not
  # start it; `docker compose --profile egress up -d` does.
  #
  # heraldyx opens three mail ports. This one, once running, lets agents reach
  # the public web on 80 and 443, which is the widest grant on this box. An
  # installer that switched it on unasked would decide the one thing an operator
  # most needs to have chosen. The credential and the cap are already in .env,
  # so turning it on is one flag and no configuration.
  #
  # It refuses to start without SCOPYX_KEYS, which install.sh generates: a wide
  # bind with no credential is an unauthenticated fetch proxy on this box, and
  # anything reaching the port could fetch under the operator's allowance and
  # with their name on the record.
  scopyx:
    <<: *restart
    profiles: ["egress"]
    image: ${SCOPYX_IMAGE:-ghcr.io/taipanbox/scopyx:v1.0.0}
    user: "65532:65532"
    environment:
      # Inside the compose network, not on the host. Nothing publishes a port
      # for this: the gateway and the console reach it by service name, and an
      # operator who wants to drive it by hand does so through them or with
      # `docker compose exec`.
      SCOPYX_ADDR: 0.0.0.0:4300
      SCOPYX_WARDRYX: http://wardryx:8090
      # `:-` and NOT `:?`, and this is not a relaxation.
      #
      # Compose interpolates every service in the file, INCLUDING ones whose
      # profile is off. With `:?` here, a box that updated compose.yaml without
      # re-running install.sh would fail to start ANYTHING, with an error naming
      # a service the operator never enabled. Measured 2026-08-09 by removing
      # both variables from a .env and running `docker compose config` with the
      # profile off: it refuses the whole file.
      #
      # Empty is safe because scopyx itself refuses to start without
      # SCOPYX_KEYS: a wide bind with no credential is an unauthenticated fetch
      # proxy, and it says so and exits. The failure stays inside the service
      # that was opted into, with a message that explains itself, instead of
      # taking the box down.
      SCOPYX_WARDRYX_KEY: ${SCOPYX_WARDRYX_KEY:-}
      SCOPYX_KEYS: ${SCOPYX_KEYS:-}
      # Its OWN journal, on its own volume, never the shared events volume. A
      # component that can write the shared log can, once compromised, corrupt
      # the trail it was adding to, and this is the only service here that
      # reaches the public internet on purpose.
      SCOPYX_EVENTS: /var/lib/scopyx/events.ndjson
      # No vendor, no account, no token. An operator who already runs a fetching
      # service sets SCOPYX_BACKEND=external and SCOPYX_EXTERNAL_ENDPOINT
      # instead, and gains a decision, a bound and a record over the tool they
      # already own.
      SCOPYX_BACKEND: ${SCOPYX_BACKEND:-passthrough}
      SCOPYX_EXTERNAL_ENDPOINT: ${SCOPYX_EXTERNAL_ENDPOINT:-}
      SCOPYX_EXTERNAL_KEY: ${SCOPYX_EXTERNAL_KEY:-}
      SCOPYX_MAX_FETCHES_PER_HOUR: ${SCOPYX_MAX_FETCHES_PER_HOUR:-200}
    volumes:
      - scopyxevents:/var/lib/scopyx
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- egress, with a browser ----------------------------------------------
  #
  # The same service, the same policy plane, the same journal volume, and one
  # difference: an image with Chromium in it, which is about 1 GB against the
  # 15 MB of the one above. That ratio is why this is a second profile rather
  # than a flag on the first: a box that wanted a governed fetcher should not
  # get a browser because somebody set a variable.
  #
  # `--profile egress-browser` INSTEAD OF `--profile egress`, never both: they
  # bind the same name in the compose network, and running both would give the
  # gateway two services called scopyx and no way to say which one it reached.
  scopyx-browser:
    <<: *restart
    profiles: ["egress-browser"]
    image: ${SCOPYX_BROWSER_IMAGE:-ghcr.io/taipanbox/scopyx:v1.0.0-chromium}
    user: "65532:65532"
    # The name the rest of the box reaches it by. Same as the profile above, so
    # nothing else in this file changes when an operator switches profiles.
    networks:
      default:
        aliases: ["scopyx"]
    environment:
      SCOPYX_ADDR: 0.0.0.0:4300
      SCOPYX_WARDRYX: http://wardryx:8090
      SCOPYX_WARDRYX_KEY: ${SCOPYX_WARDRYX_KEY:-}
      SCOPYX_KEYS: ${SCOPYX_KEYS:-}
      SCOPYX_EVENTS: /var/lib/scopyx/events.ndjson
      SCOPYX_BACKEND: chromium
      SCOPYX_MAX_FETCHES_PER_HOUR: ${SCOPYX_MAX_FETCHES_PER_HOUR:-200}
      # NOT set here, and the omission is the decision.
      #
      # Chromium ships with its renderer sandbox on. In a container that cannot
      # give it the user namespaces it needs, it refuses to start and says so,
      # and the operator then chooses which sandbox to keep. The two ways out
      # are below, and this file takes the one that keeps CHROME's, because
      # with that off a renderer exploit runs as this container's user and can
      # open sockets directly: egress that never passes the proxy and never
      # appears in the record. The container's seccomp filter protects the host
      # from the container; it does not protect the record from a compromised
      # renderer.
      #
      #   SCOPYX_CHROMIUM_NO_SANDBOX: "1"   # keeps the container's filter
      #
    # Chrome's sandbox needs syscalls the default profile refuses. Measured
    # 2026-08-10: with the default profile the browser refuses to start and
    # names the sandbox; with this line it renders a live page.
    security_opt:
      - seccomp:unconfined
    # A browser writes: a profile directory per fetch, and its own temporary
    # files. Both land here, both are wiped with the container, and neither
    # touches a named volume, because a profile that outlived a fetch is
    # invariant 4 broken by storage rather than by code.
    tmpfs:
      - /tmp:size=512m
    volumes:
      - scopyxevents:/var/lib/scopyx
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- typed: template-based answer typing --------------------------------
  #
  # Optional add-on, off unless asked for, like scopyx above. Absent, the
  # stack behaves exactly as before. Answers a typed question (a choice, a
  # score, a yes or no) from one of the three templates baked into the image,
  # with a probability for every option, and scores those probabilities
  # against truths recorded later.
  #
  # TYPRYX_BACKEND defaults to `stub` here: free, deterministic, no outbound
  # call. The image's other two backends are `openai-logprobs` (any
  # OpenAI-compatible model server, local or hosted, a hosted one metered;
  # needs TYPRYX_OPENAI_URL, TYPRYX_OPENAI_MODEL and optionally
  # TYPRYX_OPENAI_KEY_FILE) and `jev` (external, metered). Neither is a
  # default this launcher ships. @decided 2026-09-30: the operator chooses the
  # data mode, `TYPED_MODE=jev|own-model|off`, and install.sh writes the
  # variables below into `.env` for the one chosen (CLAUDE.md invariant 18).
  #
  # A key is only ever a FILE. install.sh copies the operator's key file into
  # ./typed (0400, owned by the uid typryx runs as) and this service mounts
  # that directory read only at /run/typed, so the environment below names a
  # path and never carries a key's bytes.
  #
  # It refuses to start without TYPRYX_KEYS, the same door scopyx has: a wide
  # bind with no credential is an unauthenticated typed-answer service, and
  # anything reaching it could ask under the operator's name.
  typryx:
    <<: *restart
    profiles: ["typed"]
    image: ${TYPRYX_IMAGE:-ghcr.io/taipanbox/typryx:v0.4.0}
    # Group 10001, not 65532 alone, since 2026-09-26: the journal below moved
    # onto the shared `events` volume (root:10001 2775), the same group every
    # other Go plane's bus writer runs as. The ledger stays on typryxdata,
    # still owned 65532:65532 below, and uid 65532 keeps full owner access
    # there whatever the primary gid is.
    user: "65532:10001"
    environment:
      TYPRYX_BACKEND: ${TYPRYX_BACKEND:-stub}
      # All empty unless TYPED_MODE put something in `.env`, and empty is what
      # typryx reads as unset for each of them (`:-` for the reason below).
      # Named here because compose passes a container ONLY what its
      # `environment:` names: a `.env` line for one of these, absent here,
      # never reached typryx.
      TYPRYX_JEV_KEY_FILE: ${TYPRYX_JEV_KEY_FILE:-}
      TYPRYX_OPENAI_URL: ${TYPRYX_OPENAI_URL:-}
      TYPRYX_OPENAI_MODEL: ${TYPRYX_OPENAI_MODEL:-}
      TYPRYX_OPENAI_KEY_FILE: ${TYPRYX_OPENAI_KEY_FILE:-}
      TYPRYX_TIMEOUT_MS: ${TYPRYX_TIMEOUT_MS:-}
      # @decided 2026-09-30: typryx's opt-in local training log (typryx
      # v0.3.0). Empty, which typryx reads as unset, unless TYPED_TRAINING=1
      # put `/var/lib/typryx/training` in `.env`: a directory inside the
      # typryxdata volume below, beside the ledger whose human truths the
      # export (`typryx export --training`) pairs it with. Off, nothing is
      # written and no directory is created.
      TYPRYX_TRAINING_DIR: ${TYPRYX_TRAINING_DIR:-}
      # `:-` and NOT `:?`, for the same reason as scopyx's own key: compose
      # interpolates every service in this file, including one whose profile
      # is off, so a `:?` here would refuse the whole file on a box that never
      # asked for this plane. Empty is safe because typryx itself refuses to
      # start without TYPRYX_KEYS.
      TYPRYX_KEYS: ${TYPRYX_KEYS:-}
      # @decided 2026-09-26: the journal joins the shared `events` volume now
      # that agent-passport SPEC 6.2 registers typryx's four event types
      # (typed_answer, typed_unanswered, typed_refused, calibration_drift).
      # heraldyx reads this whole directory, so it can now alert on them.
      # record-seal reads the same directory and counts all four refused,
      # never sealed: they carry agent-event v1.0, which trailryx 1.0 does not
      # read (unknown_schema, measured on stack-up 2026-09-26), and past the
      # schema its mapper refuses them by name on purpose (trailryx#81). So
      # this does not seal typryx's events; it lets them reach the notifier.
      TYPRYX_EVENTS: /var/lib/stack/events/typryx.ndjson
      # The ledger is a different kind of store, typryx's own answer/outcome
      # record rather than an agent-event stream, so it stays off the bus.
      TYPRYX_LEDGER_DIR: /var/lib/typryx/ledger
      # Off unless tokenfuse's MCP broker fronts this plane (see
      # tokenfuse-mcp-broker below): lets a tools/call with no X-Typryx-Key
      # header carry its credential at params._meta["typryx/key"] instead,
      # which is how the broker, itself blind to identity on the forwarding
      # leg, hands typryx an agent to journal a call against. initialize and
      # tools/list need no credential either way. Harmless with the broker
      # not running: nothing outside this compose network reaches this port,
      # and a caller who never sets _meta is unaffected.
      #
      # Needs typryx v0.2.0 or later: _meta credential reading is typryx#6,
      # not in v0.1.0. @measured live on this Mac, 2026-09-26, this compose
      # file with typryx v0.2.0 and tokenfuse v1.1.1: an `ask` whose key
      # travelled only as `{{secret:typryx_key}}` through the broker was
      # answered, and its `typed_answer` landed on the shared bus under the
      # key's agent with the caller's run id; a wrong key was refused 401; the
      # same call against v0.1.0 was refused 401.
      TYPRYX_ACCEPT_KEY_IN_META: "1"
    volumes:
      # Its own ledger, deliberately not the shared bus (see TYPRYX_LEDGER_DIR
      # above), and the training log when it is on (TYPRYX_TRAINING_DIR).
      - typryxdata:/var/lib/typryx
      # The shared bus, read-write, for the journal above.
      - events:/var/lib/stack/events
      # The key files TYPED_MODE installed (jev-key, model-key): read only, a
      # directory rather than a file so a box with no key has an empty mount
      # instead of Docker inventing a directory where a file was expected.
      - ./typed:/run/typed:ro
    # `host.docker.internal` is defined by Docker Desktop and NOT by Docker
    # Engine on Linux. own-model's usual server is an Ollama or vLLM on this
    # same box, so without this line its documented URL does not resolve.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- tokenfuse's MCP broker, fronting typryx ------------------------------
  #
  # OPT-IN, behind the same `typed` profile as typryx itself, never in the
  # default set. @decided 2026-09-26: tokenfuse's MCP broker fronts typryx by
  # configuration alone; tokenfuse's own code is not touched for this, same
  # image and same pinned tag as the gateway above, one subcommand:
  # `mcp-broker`.
  #
  # Bound the same way the gateway is, `${GATEWAY_BIND:-127.0.0.1}`: closed by
  # default, and a box that never widened GATEWAY_BIND never widens this door
  # either, with no second variable to remember. `gateway-cache-is-off.sh`
  # does not judge this service: its command line carries the `mcp-broker`
  # subcommand, not the bare binary, the same shape focus-export already sits
  # outside that gate for.
  tokenfuse-mcp-broker:
    <<: *restart
    profiles: ["typed"]
    image: ${TOKENFUSE_IMAGE:-ghcr.io/taipanbox/tokenfuse:v1.7.0}
    # Just the subcommand, not the full binary path: the image's own
    # ENTRYPOINT is already the tokenfuse binary (@measured `docker inspect
    # ghcr.io/taipanbox/tokenfuse:v1.1.1`, 2026-09-26), so this `command:`
    # supplies CMD, the argv the entrypoint receives. Naming the full path
    # again here as argv[0] first ran the plain gateway instead, because that
    # extra leading argument is an unrecognised subcommand and main.rs falls
    # through to `serve()` for anything it does not match; the gateway
    # service's own bare command below works today only because that same
    # fallthrough is what a bare start needs anyway. @measured live on this
    # Mac, 2026-09-26: with the full path repeated here, this container
    # served the LLM proxy on :4100 and never opened the MCP door; with just
    # the one-word subcommand, it logged "mcp credential-broker listening"
    # on :4200.
    command: ["mcp-broker"]
    environment:
      TOKENFUSE_MCP_ADDR: 0.0.0.0:4200
      TOKENFUSE_MCP_UPSTREAMS: typryx=http://typryx:4320/mcp
      # `:-` and NOT `:?`: the same interpolate-every-service reason scopyx's
      # and typryx's own keys carry above. Empty is safe because the broker
      # itself refuses a non-loopback bind with no client keys configured
      # (tokenfuse's own invariant 20); this launcher never sets
      # TOKENFUSE_MCP_ALLOW_OPEN_BIND.
      TOKENFUSE_MCP_KEYS: ${TOKENFUSE_MCP_KEYS:-}
      # The one secret in the broker's vault, reusing typryx's own TYPRYX_KEYS
      # bare key (install.sh) rather than minting a second credential that
      # could drift from the one typryx itself checks. Scoped to typryx's
      # three tools, so a secret meant for this plane cannot be pulled for
      # any other named upstream this broker might gain later.
      TOKENFUSE_MCP_SECRETS: ${TOKENFUSE_MCP_SECRETS:-}
      TOKENFUSE_MCP_SECRET_SCOPES: typryx_key=tools:ask|ask_freeform|list_questions
      # Its own file on the bus, never the gateway's, the control plane's or
      # typryx's own: two appenders on one file is a race with no lock, the
      # same reason the money plane's two writers each name their own file.
      TOKENFUSE_EVENTS_PATH: /var/lib/stack/events/tokenfuse-mcp.ndjson
      # The typed risk signal (TYPED_RISK_SIGNAL=1, opt-in, off by default).
      # The broker has no policy plane of its own: it asks wardryx about each
      # tools/call only when TOKENFUSE_WARDRYX_MODE and _URL are both set, and
      # on this launcher neither was, so a tool call was never judged. All
      # three values below are empty, which is that hook off, unless
      # install.sh wrote them into .env for a box that asked for the signal;
      # then the URL is the typryx wardryx-proxy (never wardryx itself) and
      # the mode is `enforce`. ONLY the broker is pointed there: the LLM
      # gateway keeps asking wardryx directly, because a model call has no
      # pending tool call to classify and the proxy's ask would add latency to
      # a path with a 250 ms deadline (J2-DESIGN). The key is the gateway's
      # own viewer key, which may call /v1/decide and nothing else, and the
      # proxy forwards it to wardryx unchanged.
      TOKENFUSE_WARDRYX_MODE: ${TYPED_RISK_WARDRYX_MODE:-off}
      TOKENFUSE_WARDRYX_URL: ${TYPED_RISK_WARDRYX_URL:-}
      TOKENFUSE_WARDRYX_KEY: ${WARDRYX_GATEWAY:-}
      # closed, like the gateway: with the signal on, a broker that cannot
      # reach the policy plane refuses the call rather than waving it through.
      TOKENFUSE_WARDRYX_FAILMODE: closed
      # A decide that carries a tool call waits this long (tokenfuse 1.5.0),
      # more than the shared 250 ms, because the proxy asks a typed backend
      # first and its own deadline (TYPED_RISK_ASK_TIMEOUT_MS, at most 5000)
      # must fit inside this one or the call is refused for being slow.
      TOKENFUSE_MCP_WARDRYX_TIMEOUT_MS: "7000"
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:4200:4200"
    volumes:
      - events:/var/lib/stack/events
    # `default` as before, plus the network the risk-signal proxy is on, so the
    # broker can reach it and nothing else outside the broker can.
    networks:
      - default
      - risk-signal
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      typryx:
        condition: service_started

  # ---- the typed risk signal: typryx in front of wardryx, MCP path only ----
  #
  # OPT-IN TWICE. It runs only with the `typed-risk-signal` profile, which
  # install.sh passes only when the typed plane is on (any mode but off) AND
  # the operator set TYPED_RISK_SIGNAL=1; with typed answers off the flag is
  # refused. Off, a default box has none of this, and the broker's wardryx hook
  # (above) is off with it.
  #
  # What it is: `typryx wardryx-proxy` (typryx v0.4.0, same image as typryx).
  # It forwards every request to wardryx unchanged, and for a `POST /v1/decide`
  # that carries a `tool_call` it first asks typryx `action.risk_class` about
  # that call and appends the answer to the request's `signals`. Wardryx (v1.2.0)
  # can turn a signal into a HOLD through a `hold_if_signal` policy rule and
  # into nothing else, never a deny. No answer in time, an unanswered, a
  # refusal, or truncated arguments forwards the request untouched, so a
  # missing signal costs a person nothing. This launcher seeds NO
  # `hold_if_signal` policy: the signal does nothing until the operator writes
  # one (the README has an example).
  #
  # WHY IT RUNS WITHOUT A KEY, AND WHAT THAT ASKS OF THE NETWORK. A non-loopback
  # bind with no TYPRYX_KEYS is refused unless TYPRYX_ALLOW_OPEN_BIND=1; with
  # TYPRYX_KEYS the proxy demands an X-Typryx-Key header on every request, and
  # the broker cannot add one to its calls to wardryx. So it is open, and what
  # keeps it closed is who can reach it: it is on the `risk-signal` network
  # alone, publishes no port, and the only other members are the broker (its
  # one caller) and wardryx (its upstream). `typed-risk-signal.sh` holds all of
  # that. Anything that could reach it could spend this box's ask budget, which
  # is why it must never join `default`.
  #
  # NO JOURNAL, NO LEDGER here. typryx.ndjson belongs to the `typryx` service
  # (one appender per bus file, no lock) and the source rule heraldyx 0.3.0 and
  # idryx 1.1.0 apply allows only `<source>.ndjson`, so a second typryx file
  # would be refused anyway; the ledger is the typed plane's own record of
  # answers and truths, which a proxy's asks are not. Without TYPRYX_KEYS the
  # journal would skip these asks regardless (no agent identity).
  #
  # WHAT IT COSTS ON A PAID BACKEND: every tool call through the broker is one
  # ask, whatever the policy reads. typryx's hourly cap (1000 by default) is the
  # limit; a spent cap just stops signals being added.
  typryx-wardryx-proxy:
    <<: *restart
    profiles: ["typed-risk-signal"]
    image: ${TYPRYX_IMAGE:-ghcr.io/taipanbox/typryx:v0.4.0}
    user: "65532:65532"
    command: ["wardryx-proxy"]
    environment:
      TYPRYX_PROXY_ADDR: 0.0.0.0:4330
      # wardryx by service name, on the `risk-signal` network. The proxy
      # forwards the caller's Authorization header as received, so wardryx
      # authenticates the broker exactly as it would directly.
      TYPRYX_PROXY_UPSTREAM: http://wardryx:8090
      TYPRYX_ALLOW_OPEN_BIND: "1"
      # The one deadline an operator may want to move: the most a slow backend
      # may add to one tool call. typryx's own default (150) is shorter than a
      # hosted model answers (about 230 ms measured for Jev) and far shorter
      # than a model on a CPU (about 2100 ms), so at the default most real
      # asks would be dropped as late and the signal would almost never appear.
      TYPRYX_PROXY_ASK_TIMEOUT_MS: ${TYPED_RISK_ASK_TIMEOUT_MS:-3000}
      # The backend config the typed plane already passes, identical to the
      # typryx service above and for the same reasons (empty reads as unset).
      TYPRYX_BACKEND: ${TYPRYX_BACKEND:-stub}
      TYPRYX_JEV_KEY_FILE: ${TYPRYX_JEV_KEY_FILE:-}
      TYPRYX_OPENAI_URL: ${TYPRYX_OPENAI_URL:-}
      TYPRYX_OPENAI_MODEL: ${TYPRYX_OPENAI_MODEL:-}
      TYPRYX_OPENAI_KEY_FILE: ${TYPRYX_OPENAI_KEY_FILE:-}
      TYPRYX_TIMEOUT_MS: ${TYPRYX_TIMEOUT_MS:-}
    volumes:
      # The key files TYPED_MODE installed, read only, the same mount typryx has.
      - ./typed:/run/typed:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # On the risk-signal network and NOWHERE else. Never `default`.
    networks:
      - risk-signal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      wardryx:
        condition: service_started

  # ---- delegation: a proved chain instead of a claimed one -----------------
  #
  # OPT-IN, behind the `delegation` profile, off unless asked for, like
  # scopyx, typryx and the record plane above. `docker compose up -d` does not
  # start it; `WITH_DELEGATION=1 ./install.sh` does.
  #
  # @decided 2026-09-27: the launchers offer vouchryx as an opt-in delegation
  # plane, off by default, so a gateway can verify a proved delegation chain
  # instead of trusting a claimed one. Off, `chainproof::resolve` in the
  # gateway returns a CLAIMED chain: `x-fuse-on-behalf-of` is whatever the
  # caller typed, and a policy reading `deny_if_chain_unproven` denies on the
  # strength of an assertion rather than a proof. This is the gap the previous
  # revision of this file's own README named and left open; see the
  # "Delegation" section there for what turning this on buys and what it does
  # not cover.
  #
  # WHY VOUCHRYX_ADDR IS HARDCODED HERE, UNLIKE EVERY OTHER `${VAR:-default}`
  # LINE IN THIS FILE. vouchryx's own default, `127.0.0.1:4310`, binds inside
  # this container to an address nothing else in the compose network can
  # reach, the same trap README's "Traps, already fixed here" already names
  # for the money and policy planes. There is no operator decision to make
  # here (this plane is never published to the host either way, see below),
  # so the fix is a fixed value, not a variable with a safer default.
  vouchryx:
    <<: *restart
    profiles: ["delegation"]
    image: ${VOUCHRYX_IMAGE:-ghcr.io/taipanbox/vouchryx:v0.2.0}
    # Group 10001, the same pair typryx and the money plane's writers use: its
    # journal (VOUCHRYX_EVENTS_PATH) lands on the shared `events` volume,
    # root:10001 2775, and this is how it can append there.
    user: "65532:10001"
    environment:
      VOUCHRYX_ADDR: 0.0.0.0:4310
      # This exact literal, `http://vouchryx:4310`, is also `install.sh`'s own
      # `TOKENFUSE_DELEGATION_ISSUER` default once WITH_DELEGATION=1: the
      # gateway verifies a token issued under the issuer this line names, so
      # the two must read identically. Section 9's `WARDRYX_DB` trap is the
      # same shape one variable over; if you are changing this line, change
      # that one with it.
      VOUCHRYX_ISSUER: http://vouchryx:4310
      VOUCHRYX_SIGNING_KEY: /etc/vouchryx/signing.pem
      # `:-` and NOT `:?`, the same reason scopyx's and typryx's own keys
      # carry above: compose interpolates every service in this file,
      # including one whose profile is off, so a `:?` here would refuse the
      # whole file on a box that never asked for this plane. Empty is safe
      # because vouchryx itself refuses to start with zero trusted issuers
      # (an empty `VOUCHRYX_TRUSTED_ISSUERS` parses to zero entries), the same
      # closed-by-default shape scopyx and typryx take on their own keys.
      VOUCHRYX_TRUSTED_ISSUERS: ${VOUCHRYX_TRUSTED_ISSUERS:-}
      VOUCHRYX_EVENTS_PATH: /var/lib/stack/events/vouchryx.ndjson
      # Empty here means `POST /v1/revoke` itself refuses every call
      # (vouchryx's own fail-closed default), not that this plane is open.
      VOUCHRYX_REVOKE_KEYS: ${VOUCHRYX_REVOKE_KEYS:-}
      # On its own volume, never the shared `events` bus: a revocation is not
      # an agent event, and it has to survive a plain `docker compose down`
      # the same way `pgdata` and `wgstate` already do, so an operator
      # clearing the bus never quietly un-revokes a delegation.
      VOUCHRYX_REVOCATIONS_PATH: /var/lib/vouchryx/revocations.ndjson
    volumes:
      # The signing key and, when WITH_DELEGATION_DEMO_ISSUER minted one, the
      # demo issuer's own public JWKS: both written once by install.sh into
      # ./delegation and reused on every later run, read only here because
      # this container never needs to write either.
      - ./delegation:/etc/vouchryx:ro
      - vouchryxdata:/var/lib/vouchryx
      - events:/var/lib/stack/events
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- money: the control API ----------------------------------------------
  tokenfuse-cloud:
    <<: *restart
    image: ${TOKENFUSE_CLOUD_IMAGE:-ghcr.io/taipanbox/tokenfuse-control-plane:v1.7.0}
    command: ["/usr/local/bin/tokenfuse-cloud"]
    environment:
      PORT: "8080"
      # The binary binds loopback by default, which inside a container means
      # nothing else can reach it. Bind the container's own address instead.
      TOKENFUSE_CLOUD_HOST: 0.0.0.0
      TOKENFUSE_CLOUD_KEYS: ${CLOUD_KEYS:?set by install.sh}
      TOKENFUSE_CLOUD_DATA: /var/lib/stack/cloud/state.json
      # The control plane's own half of the bus. Its detectors (a budget gone,
      # a sustained loop) are incidents the notifier should mail and the
      # record should seal, and without this line they never left
      # /v1/incidents and the console. Its own file, not the gateway's: two
      # writers appending to one file is a race on a bus that has no lock.
      # init-volumes pre-creates it, because this uid cannot (see there).
      # Measured 2026-09-17 with both in place: the next budget_exhausted
      # reached the bus and the notifier's offsets picked the file up (#57).
      TOKENFUSE_EVENTS_PATH: /var/lib/stack/events/tokenfuse-cloud.ndjson
    volumes:
      - events:/var/lib/stack/events
      - cloudstate:/var/lib/stack/cloud
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- money: the enforcing proxy ------------------------------------------
  # The one service published to a host port at all, because it is the one
  # agents elsewhere call. WHICH host address it lands on is the operator's
  # decision: `GATEWAY_BIND` in .env, loopback unless they said otherwise.
  # Everything it does is metered, and an over-budget or policy-denied call
  # gets a hard refusal rather than a log line.
  tokenfuse-gateway:
    <<: *restart
    image: ${TOKENFUSE_IMAGE:-ghcr.io/taipanbox/tokenfuse:v1.7.0}
    command: ["/usr/local/bin/tokenfuse"]
    environment:
      TOKENFUSE_ADDR: 0.0.0.0:4100
      # The gateway's observability and kill routes (/v1/runs,
      # /v1/runs/{id}/kill, /v1/keys, /v1/policy-plane, /v1/agent-ids) take
      # this key, GATEWAY_ADMIN from install.sh, as a bearer credential.
      # tokenfuse v0.4.4 enforces it: with no key or the wrong one, all five
      # routes refuse; the console presents the same value below. The bridge
      # that used to hold this open, TOKENFUSE_ALLOW_OPEN_OBS, is gone as of
      # phase 3 of the gateway admin key plan (2026-09-07): the key is the
      # only door now, and widening GATEWAY_BIND no longer widens these
      # routes to anyone without it.
      TOKENFUSE_ADMIN_KEYS: ${GATEWAY_ADMIN:?set by install.sh}
      # POST /v1/fuse/declassify lifts a run's taint label and is not behind
      # the admin key: it takes its own credential, presented as
      # `x-fuse-declassify-key`. Unset, the gateway lets anything that reaches
      # the port clear a run and records only `authenticated: false`. Set from
      # .env (GATEWAY_DECLASSIFY_KEY, minted once by install.sh), so only the
      # operator holds it; nothing in this stack calls the endpoint.
      # `declassify-is-keyed.sh` holds it, and a literal here is a failure.
      TOKENFUSE_DECLASSIFY_KEY: ${GATEWAY_DECLASSIFY_KEY:?set by install.sh}
      TOKENFUSE_MODE: enforce
      # The most a caller can make one run's budget. A run's budget used to be
      # whatever the agent said in `x-fuse-budget-usd`, and its next call could
      # widen it; tokenfuse 1.5.0 (invariant 73) clamps a budget that came
      # from that header, a policy default or its built-in default to this
      # figure on every call. 5.00 is tokenfuse's own default run budget, so an
      # ordinary run is unchanged and only a larger declared budget is clamped.
      # A budget set in the Cloud is the operator's own word and is never
      # clamped. One installer variable moves it (RUN_BUDGET_CEILING_USD, a
      # positive number of dollars with at most six decimals); tokenfuse exits
      # 2 on anything else, which `run-budget-ceiling.sh` and install.sh both
      # refuse first. `run-budget-ceiling.sh` holds that every gateway sets it.
      TOKENFUSE_MAX_RUN_BUDGET_USD: ${RUN_BUDGET_CEILING_USD:-5.00}
      TOKENFUSE_DATA_DIR: /var/lib/stack/traces/gateway
      # With this unset, the gateway defaults its semantic response cache to
      # `shadow`: every call takes one global mutex, walks up to 10,000 cached
      # entries computing cosine similarity, serves nothing, and appends
      # another entry. Measured on a 4-core N150 appliance under this
      # launcher's own stack: 50 agents gave 177 calls/s with 403 refusals and
      # CPU 79-92% inside SemanticCache::get; with the cache off, 1102
      # calls/s, zero refusals, no slowdown over time (tokenfuse#319). Off
      # explicitly, ahead of the gateway's own default changing.
      TOKENFUSE_CACHE: "off"
      # The bus half of this stack. Without it the gateway's exporter is off
      # (tokenfuse reads this variable and nothing else), the file init-volumes
      # pre-creates stays empty, idryx loads an empty log forever, heraldyx
      # alerts on nothing from the money plane and the record seals none of
      # it. It was missing until 2026-09-13, when the 1.0 proving run found
      # the file at 0 bytes after a day of refusals; every install check had
      # passed. `bus-has-a-writer.sh` holds it now, and install.sh section 8
      # reads the gateway's own "export enabled" line.
      TOKENFUSE_EVENTS_PATH: /var/lib/stack/events/tokenfuse.ndjson
      TOKENFUSE_UPSTREAM: https://api.anthropic.com/v1/messages
      TOKENFUSE_CLOUD_URL: http://tokenfuse-cloud:8080
      TOKENFUSE_CLOUD_KEY: ${CLOUD_ADMIN:?set by install.sh}
      TOKENFUSE_WARDRYX_MODE: enforce
      TOKENFUSE_WARDRYX_URL: http://wardryx:8090
      TOKENFUSE_WARDRYX_KEY: ${WARDRYX_GATEWAY:?set by install.sh}
      # closed, not open: if the policy plane cannot answer, the call is
      # refused. An enforcement point that fails open is a log with extra steps.
      TOKENFUSE_WARDRYX_FAILMODE: closed
      TOKENFUSE_WARDRYX_TIMEOUT_MS: "250"
      TOKENFUSE_WARDRYX_CACHE_TTL_MS: "3000"
      # Delegation, opt-in like the typed plane above: every one of these six
      # is `:-` with an EMPTY fallback, and install.sh only ever writes a
      # non-empty value into .env when WITH_DELEGATION=1. Empty is not a
      # smaller version of the feature, it is the feature off: unset,
      # `chainproof::resolve` returns a claimed chain exactly as it does
      # today, on every box that does not ask for this. Never widen any one
      # of these defaults on its own; see CLAUDE.md invariant 15.
      TOKENFUSE_DELEGATION_ISSUER: ${TOKENFUSE_DELEGATION_ISSUER:-}
      # A file path INSIDE this container, read once at startup; the volume
      # mount below is what makes it exist there. install.sh writes the file
      # itself only after vouchryx is up and answering its own
      # /.well-known/jwks.json, never from vouchryx-demo's own keygen output:
      # vouchryx signs with the key's RFC 7638 thumbprint as `kid`, not
      # whatever label a keygen run was given, so a JWKS this deployment did
      # not fetch FROM the running vouchryx would carry the wrong `kid` and
      # every token would be refused `BadToken`. Measured 2026-09-27.
      TOKENFUSE_DELEGATION_JWKS: ${TOKENFUSE_DELEGATION_JWKS:-}
      TOKENFUSE_DELEGATION_AUDIENCE: ${TOKENFUSE_DELEGATION_AUDIENCE:-}
      # The absolute origin agents actually reach this gateway at, for the
      # DPoP `htu` a hand-off proof is checked against; install.sh derives it
      # from GATEWAY_BIND the same way its own health check does.
      TOKENFUSE_DELEGATION_URL: ${TOKENFUSE_DELEGATION_URL:-}
      # Reached over the compose network by service name: this plane is never
      # published to the host (see the vouchryx service above), and the
      # gateway does not need it to be.
      TOKENFUSE_DELEGATION_REVOCATIONS: ${TOKENFUSE_DELEGATION_REVOCATIONS:-}
      TOKENFUSE_DELEGATION_REVOCATIONS_INTERVAL_MS: ${TOKENFUSE_DELEGATION_REVOCATIONS_INTERVAL_MS:-}
    ports:
      # Loopback if the variable is absent, matching install.sh. The fallback
      # matters on its own: someone running `docker compose up` by hand
      # without an .env would otherwise publish an enforcement plane to every
      # interface because a variable was unset, which is the wrong direction
      # for a default to fail in.
      - "${GATEWAY_BIND:-127.0.0.1}:4100:4100"
    volumes:
      - events:/var/lib/stack/events
      - traces:/var/lib/stack/traces
      # Read only, and always mounted: the delegation JWKS file install.sh
      # writes lives here once WITH_DELEGATION=1 (./delegation-public, never
      # ./delegation, which holds vouchryx's signing key and is its uid's alone), at the exact path
      # TOKENFUSE_DELEGATION_JWKS names above. Harmless on a default box the
      # same way ./environments is always mounted into the console below
      # whether or not that plane is installed: an empty directory, nothing
      # this container reads unless the env var above also names a file in it.
      - ./delegation-public:/etc/tokenfuse/delegation:ro
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      tokenfuse-cloud:
        condition: service_started
      wardryx:
        condition: service_started

  # ---- the console ---------------------------------------------------------
  # Loopback only. It arrives over the operator's own tunnel, never off the
  # open internet, which is the same posture the cluster deployment takes.
  # ---- the operator's road in ----------------------------------------------
  # A WireGuard server for the humans who run this box. Deliberately its own
  # container: it needs NET_ADMIN and a tun device, and the console must not.
  # The console manages peers over the UAPI socket on the shared `wgapi`
  # volume, holding no capability of its own.
  wg:
    <<: *restart
    image: ${WG_IMAGE:-ghcr.io/taipanbox/stack-wg:v1.0.0}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      WG_IFACE: ${WG_IFACE:-wg-op}
      WG_LISTEN_PORT: "${WG_LISTEN_PORT:-51820}"
      # The uid the console image runs as, so the socket is reachable by it
      # and by nothing else on the volume.
      WG_SOCKET_GID: "10001"
      # The tunnel leads to TLS, not to the console directly. The console is
      # still plain HTTP on its own port, reachable only from inside this
      # compose network - Caddy is what a device in the tunnel talks to, and
      # what makes the passkey ceremony possible at all.
      WG_CONSOLE_HOST: caddy
      WG_CONSOLE_PORT: "443"
    ports:
      # Published on purpose, and the one port here that has to be: a tunnel
      # nobody can dial is not a tunnel. Unlike the gateway, WireGuard answers
      # nothing at all without a valid key - no banner, no handshake, no
      # response to a scan - which is exactly why it is the road in rather
      # than an exposed HTTP plane.
      - "${WG_BIND:-0.0.0.0}:${WG_LISTEN_PORT:-51820}:${WG_LISTEN_PORT:-51820}/udp"
    volumes:
      - wgstate:/var/lib/wireguard
      - wgapi:/var/run/wireguard

  # ---- TLS for the console, inside the tunnel ------------------------------
  # Not a way in from the internet: this listens on the TUNNEL address only,
  # and exists because WebAuthn refuses to run without a secure context and
  # refuses a bare IP as the relying party. Without it the passkey ceremony
  # simply cannot happen over WireGuard, on any device.
  caddy:
    <<: *restart
    image: ${CADDY_IMAGE:-ghcr.io/taipanbox/stack-caddy:v1.0.0}
    environment:
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:?set by install.sh}
      CONSOLE_UPSTREAM: console:7420
      # Present -> a real Let's Encrypt certificate over DNS-01. Absent ->
      # Caddy's internal CA, which works only on devices told to trust it.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      console:
        condition: service_started

  console:
    <<: *restart
    image: ${CONSOLE_IMAGE:-ghcr.io/taipanbox/genaryx-console:v1.1.25}
    environment:
      HOME: /var/lib/stack
      TAIPAN_HOME: /etc/genaryx/taipan
      # Where the console keeps its bus history (console.sqlite). Said outright
      # since 2026-09-14: without it the console used <TAIPAN_HOME>/genaryx,
      # which is the read-only config mount above, could not create it, and
      # served every install with an empty Bus Explorer (genaryx#71, #49). The
      # state volume is the one place it can write, so it is named here.
      GENARYX_STATE_DIR: /var/lib/stack/genaryx
      GENARYX_SCAN_TARGET: /srv/ui
      # Felyx, the console's copilot, talks to its model THROUGH this box's own
      # gateway, so its calls are priced, budgeted and policy-checked like any
      # agent's. @decided 2026-09-27: the launchers route Felyx through the
      # stack's gateway by default, with its agent id in the trust domain.
      # Its residency check refuses any endpoint it cannot prove local; the
      # gateway is reached by its compose service name, allow-listed here and
      # resolved on every connection to private addresses only (genaryx
      # invariant 14, console v1.1.17 on). No key ships: set
      # GENARYX_COPILOT_KEY in .env and `docker compose up -d console`; until
      # then Felyx says it is not configured and the console works as before.
      GENARYX_COPILOT_PROVIDER: anthropic
      GENARYX_COPILOT_BASE_URL: http://tokenfuse-gateway:4100
      GENARYX_COPILOT_LOCAL_HOSTNAMES: tokenfuse-gateway
      GENARYX_COPILOT_MODEL: ${GENARYX_COPILOT_MODEL:-claude-haiku-4-5}
      GENARYX_COPILOT_AGENT_ID: agent://${RECORD_TRUST_DOMAIN:-local}/genaryx/felyx
      GENARYX_COPILOT_API_KEY_REF: env:GENARYX_COPILOT_KEY
      GENARYX_COPILOT_KEY: ${GENARYX_COPILOT_KEY:-}
      TOKENFUSE_CLOUD_URL: http://tokenfuse-cloud:8080
      # ADMIN_KEY, not CLOUD_KEY. `TOKENFUSE_CLOUD_KEY` is the name the GATEWAY
      # reads; the console's money plane looks for `TOKENFUSE_CLOUD_ADMIN_KEY`
      # and finds nothing under the other spelling, so every install came up
      # with an Overview that said "No environment found" while a perfectly
      # healthy Cloud sat one container away. The policy plane below was right
      # all along, which is what made the difference easy to miss.
      TOKENFUSE_CLOUD_ADMIN_KEY: ${CLOUD_ADMIN:?set by install.sh}
      # The same GATEWAY_ADMIN key the gateway enforces above, so the console
      # can reach its observability and kill routes: tokenfuse v0.4.4
      # requires it on all five, with no bridge left to fall back to.
      TOKENFUSE_GATEWAY_ADMIN_KEY: ${GATEWAY_ADMIN:?set by install.sh}
      WARDRYX_URL: http://wardryx:8090
      WARDRYX_ADMIN_KEY: ${WARDRYX_ADMIN:?set by install.sh}
      GENARYX_WG_IFACE: ${WG_IFACE:-wg-op}
      # The RELAY socket, not the daemon's own: wireguard-go requires its socket
      # to stay 0700 and stops answering if that changes, so the wg container
      # forwards a group-readable one to it.
      GENARYX_WG_UAPI_SOCKET: /var/run/wireguard/console.sock
      # The address a phone dials from outside. Nothing on the interface can
      # report it, so the installer writes it and the console refuses to guess.
      GENARYX_WG_ENDPOINT_HOST: ${WG_ENDPOINT_HOST:?set by install.sh}
      # WebAuthn binds credentials to this exact pair. It must match what the
      # browser addresses through Caddy, or every assertion is refused with a
      # mismatch that reads like a broken passkey rather than a wrong origin.
      GENARYX_WEB_RP_ID: ${CONSOLE_DOMAIN:?set by install.sh}
      GENARYX_WEB_ORIGIN: https://${CONSOLE_DOMAIN:?set by install.sh}
      # The five sensitive commands (kill a run, set a budget, decide an
      # approval, issue a device, revoke one) must not run on a session cookie
      # alone: a stolen session should not be able to pull the switch. Enrolment
      # happens over the tunnel at CONSOLE_DOMAIN, with the operator password as
      # the factor, and the first device is issued by install.sh itself, not in
      # the browser, because the browser cannot reach that domain before a
      # tunnel exists.
      GENARYX_WEB_REQUIRE_PASSKEY: "1"
    ports:
      - "127.0.0.1:7420:7420"
    volumes:
      - consolestate:/var/lib/stack
      - events:/var/lib/stack/events
      - ./environments:/etc/genaryx/taipan/environments:ro
      - wgapi:/var/run/wireguard
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      tokenfuse-cloud:
        condition: service_started
      wardryx:
        condition: service_started
      idryx:
        condition: service_started

  # ---- record: the tamper-evident store of what this box did ----------------
  #
  # Off unless asked for, like the egress plane above. `docker compose up -d`
  # does not start it; `docker compose --profile record up -d record-seal`
  # does, and `WITH_RECORD=1 ./install.sh` is what builds its image.
  #
  # The bus and the record are two different things and this is the seam
  # between them. `events` is a BUS: four components append to it, anything may
  # read it, and an operator clearing space deletes from it. This writes a
  # hash-chained STORE of sealed segments with one cursor per source file, and
  # it lives on its OWN volume for exactly that reason. A record kept inside
  # the volume its own inputs live in is evidence an operator can delete while
  # tidying up the thing it is evidence about.
  #
  # One container running one loop, rather than a timer, because compose has no
  # cron and because the store takes no cross-process lock: a second writer
  # would be two minters of one shard. The cluster gets the same property from
  # `concurrencyPolicy: Forbid` on its CronJob. Serial here is structural, not
  # a promise.
  record-seal:
    <<: *restart
    image: ${TRAILRYX_IMAGE:-ghcr.io/taipanbox/trailryx-node:v1.0.0}
    user: "10001:10001"
    profiles: ["record"]
    environment:
      # Deliberately invalid, exactly as the cluster's ConfigMap is. This is
      # the one value nobody else can supply: unlike stack-up, which mints its
      # own demo fleet, this deployment governs whatever fleet an operator
      # points at it, so nothing here knows the domain their agents mint under.
      #
      # A wrong value used to be worse than a missing one. `--trust-domain`
      # takes ONE value, every non-matching line is refused, and the cursor
      # committed the position it reached even when nothing was stored, so one
      # pass under the wrong domain put those events permanently outside the
      # record and the next pass answered "nothing new". trailryx holds the
      # cursor for that case since 2026-08-27 and has two tests on it, so the
      # loss path is closed at the source. The refusal below is still here
      # because being told beats being silently correct.
      RECORD_TRUST_DOMAIN: ${RECORD_TRUST_DOMAIN:-set-me.invalid}
      # Daily, like the cluster's 05:27 and stack-up's 06:57. Settable so a
      # box under test does not wait a day to show it works.
      RECORD_SEAL_INTERVAL: ${RECORD_SEAL_INTERVAL:-86400}
    command:
      - /bin/sh
      - -c
      - |
        set -u
        events=/var/lib/stack/events
        data=/var/lib/stack/records
        while :; do
          # REFUSE BEFORE CONSUMING. The check reads the agent ids already on
          # the bus against the domain about to be passed, and refuses only
          # when NOTHING matches: a partial match is a normal state for a box
          # governing more than one domain, and `--trust-domain` takes one.
          seen=0; matched=0
          for f in "$$events"/*.ndjson; do
            [ -e "$$f" ] || continue
            # `n=$$(grep -c ...) || n=0` and NOT `... || echo 0`. grep -c
            # prints 0 AND exits 1 when it matches nothing, so the `echo`
            # form appends a second zero and the arithmetic below dies with
            # "syntax error in expression". Under `set -u` without `set -e`
            # the loop then carries on and seals anyway, so the refusal this
            # whole block exists for would never have fired. Found by running
            # the script, not by reading it.
            # `grep -E` with optional whitespace, not a fixed string. The
            # first version matched `"agent_id":"agent://` exactly and
            # refused a bus whose writer had put a space after the colon,
            # reporting 20 ids seen and 0 matched on ids that all matched.
            # Every producer in this estate is Go or Rust and writes compact
            # JSON, so this would have held here and broken for the first
            # producer that did not. Found by running the real image against
            # a real bus, not by reading it.
            n=$$(grep -cE '"agent_id"[[:space:]]*:' "$$f" 2>/dev/null) || n=0
            m=$$(grep -cE "\"agent_id\"[[:space:]]*:[[:space:]]*\"agent://$$RECORD_TRUST_DOMAIN/" "$$f" 2>/dev/null) || m=0
            seen=$$((seen + n)); matched=$$((matched + m))
          done
          if [ "$$seen" -gt 0 ] && [ "$$matched" -eq 0 ]; then
            echo "refusing before importing: none of the $$seen agent id(s) on the bus is under" >&2
            echo "  agent://$$RECORD_TRUST_DOMAIN/ , so this would seal nothing and say it worked." >&2
            echo "  Set RECORD_TRUST_DOMAIN in .env to the domain your agents mint under." >&2
            sleep "$$RECORD_SEAL_INTERVAL"; continue
          fi
          sealed=0
          for f in "$$events"/*.ndjson; do
            [ -e "$$f" ] || continue
            # Best-effort per file, like the cluster's job and stack-up's
            # routine: one unreadable file is that file's problem, not a reason
            # to leave every other file's new events unsealed.
            trailryx-node events --file "$$f" --data "$$data" \
              --trust-domain "$$RECORD_TRUST_DOMAIN" --seal-records 500 || true
            sealed=$$((sealed + 1))
          done
          if [ "$$sealed" -eq 0 ]; then
            echo "no event files in $$events yet; nothing to seal"
          else
            pack="$$data/pack-$$(date -u +%Y%m%dT%H%M%SZ).pack"
            if trailryx-node read --data "$$data" --all --pack "$$pack"; then
              # Verified before the loop sleeps. A pack that does not verify is
              # the one thing that makes this loud, which is the record plane's
              # own discipline: a refused line is counted and reported and is
              # not an error.
              trailryx-verify "$$pack" || echo "PACK DID NOT VERIFY: $$pack" >&2
            else
              echo "nothing sealed here to pack yet"
            fi
          fi
          sleep "$$RECORD_SEAL_INTERVAL"
        done
    volumes:
      # Read only. This is a reader of the bus and a writer of the record, and
      # the mount says so rather than the code being trusted to.
      - events:/var/lib/stack/events:ro
      - records:/var/lib/stack/records
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- routines: the scheduled half, which this deployment did not have ------
  #
  # Off unless asked for: `docker compose --profile routines up -d`.
  #
  # THE GAP THIS CLOSES. stack-up runs five governance routines on a timer and
  # stack-k8s runs four as CronJobs. This deployment installed NO scheduler of
  # any kind, so the planes came up and the work that keeps them producing did
  # not happen. estate-gates recorded that as six divergences from 2026-08-06,
  # and it is the single-box install, the one most likely to be somebody's first
  # look at the estate.
  #
  # WHY THEY ARE LOOPS AND NOT TIMERS. compose has no cron, which is the same
  # reason `record-seal` above is a service rather than a job. Each of these
  # sleeps, runs once, prints, and sleeps again; the artifact is the log, which
  # is what stack-k8s's quality-drift does too.
  #
  # THREE OF THE FIVE, AND THE OTHER TWO ARE SAID OUT LOUD RATHER THAN QUIETLY
  # LEFT OUT:
  #
  #   qryx-trend     scans a SOURCE TREE. stack-up points it at its own
  #                  checkout of the estate's repositories. There is no source
  #                  tree in these containers and mounting the operator's disk
  #                  into a governance plane to look for crypto is a bigger
  #                  decision than a missing routine.
  #   mockryx-drill  needs the scenario files, which live in the mockryx
  #                  repository and are not in this image, and it is opt-in in
  #                  both other deployments anyway.
  #
  # The sixth, trailryx-seal, is the `record` profile above.
  focus-export:
    <<: *restart
    image: ${TOKENFUSE_IMAGE:-ghcr.io/taipanbox/tokenfuse:v1.7.0}
    user: "10001:10001"
    profiles: ["routines"]
    environment:
      ROUTINE_INTERVAL: ${ROUTINE_INTERVAL:-3600}
    command:
      - /bin/sh
      - -c
      - |
        set -u
        traces=/var/lib/stack/traces/gateway
        out=/var/lib/stack/focus
        sleep "$$ROUTINE_INTERVAL"
        while :; do
          if [ ! -d "$$traces" ]; then
            echo "focus-export: no trace directory at $$traces yet"
          elif tokenfuse focus-export --traces "$$traces" \
                 --out "$$out/focus-$$(date -u +%Y%m%dT%H%M%SZ).csv" 2>&1; then
            echo "focus-export: wrote a window"
          else
            # An idle window exits non-zero with "no calls found in the trace",
            # which is not a failure of the export. stack-up's routine makes the
            # same judgement.
            echo "focus-export: nothing to export in this window"
          fi
          sleep "$$ROUTINE_INTERVAL"
        done
    volumes:
      # Read only. It reads what the gateway wrote and must not be able to edit
      # it, the same split the record profile makes over the bus.
      - traces:/var/lib/stack/traces:ro
      - focus:/var/lib/stack/focus
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # A TEMPLATE A PERSON RUNS, not a loop, and the reason is that a loop is
  # impossible here rather than unwanted.
  #
  # Measured 2026-09-01 against the published image, three ways:
  #
  #   docker run --entrypoint /bin/sh ghcr.io/taipanbox/idryx:v1.0.0
  #     stat /bin/sh: no such file or directory
  #   docker run --entrypoint idryx ...
  #     exec: "idryx": executable file not found in $PATH
  #   docker run --entrypoint /usr/local/bin/service ... detect --help
  #     usage: idryx detect [flags] <log.json>
  #
  # `go-service.Dockerfile` builds on `gcr.io/distroless/static-debian12`, so
  # there is no shell for a `sleep` loop to run in, and the binary is
  # `/usr/local/bin/service` whatever the usage line calls itself. This service
  # was written as a shell loop calling `idryx`, so it could not start on any
  # image this estate builds or publishes, and nothing noticed because the
  # `routines` profile is never enabled by install.sh.
  #
  # THE THREE WAYS OUT, AND WHY THIS ONE
  #
  # Publishing a shell-bearing idryx would put a shell back into a governance
  # plane to buy a scheduler, which trades a security property for a
  # convenience. `detect` has no `--interval` or `--watch`, so the loop cannot
  # move into the binary either: it is a one-shot by design.
  #
  # So it becomes what it actually is, and the estate already has the shape:
  # stack-k8s ships `costcrew-crew` as a suspended CronJob a person runs. The
  # compose equivalent is a service behind a profile no install ever enables,
  # started by hand:
  #
  #   docker compose run --rm idryx-detect
  #
  # `manifest-is-true.sh` checks that install.sh never passes `--profile
  # manual`, which is this file's answer to the `suspend: true` stack-k8s's own
  # gate checks. The other two routines in the `routines` profile are unaffected
  # and still loop: focus-export runs on the tokenfuse image and verdryx-drift
  # on the console, and both of those have a shell.
  idryx-detect:
    restart: "no"
    image: ${IDRYX_IMAGE:-ghcr.io/taipanbox/idryx:v1.1.0}
    user: "65532:10001"
    profiles: ["manual"]
    # The entrypoint by its real path, and the arguments straight to it, which
    # is exactly how stack-k8s's identity-sweep CronJob invokes the same work.
    entrypoint: ["/usr/local/bin/service"]
    command:
      - detect
      - --load
      - tokenfuse:/var/lib/stack/events/tokenfuse.ndjson
      - --format
      - human
    volumes:
      - events:/var/lib/stack/events:ro
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  verdryx-drift:
    <<: *restart
    image: ${CONSOLE_IMAGE:-ghcr.io/taipanbox/genaryx-console:v1.1.25}
    user: "10001:10001"
    profiles: ["routines"]
    environment:
      ROUTINE_INTERVAL: ${ROUTINE_INTERVAL:-3600}
      # Empty means "skip", which is the honest default: a drift check needs a
      # baseline somebody chose, and inventing one would compare against a
      # number nobody stands behind. stack-up's routine skips for the same
      # reason and says so.
      ROUTINE_VERDRYX_BASELINE: ${ROUTINE_VERDRYX_BASELINE:-}
    command:
      - /bin/sh
      - -c
      - |
        set -u
        db=/var/lib/stack/.taipan/verdryx.db
        sleep "$$ROUTINE_INTERVAL"
        while :; do
          if [ -z "$$ROUTINE_VERDRYX_BASELINE" ]; then
            echo "verdryx-drift: skipped, ROUTINE_VERDRYX_BASELINE is not set in .env"
          elif [ ! -f "$$db" ]; then
            echo "verdryx-drift: skipped, no store at $$db (no verdryx eval has run here)"
          else
            VERDRYX_DB="$$db" verdryx drift --baseline "$$ROUTINE_VERDRYX_BASELINE" 2>&1 || true
          fi
          sleep "$$ROUTINE_INTERVAL"
        done
    volumes:
      - consolestate:/var/lib/stack:ro
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ---- finops: the CostCrew console, an optional add-on ---------------------
  #
  # OFF, and install.sh does not know it exists. `docker compose up -d` does not
  # start it and neither does any install.sh run, with or without a flag; an
  # operator turns it on by hand, once:
  #
  #   docker compose --profile finops up -d costcrew
  #
  # That is the same way `routines`, `manual` and the second half of `record`
  # and `egress` are started here, and it is the right one for this add-on:
  # install.sh brings up on its own only the planes its own end-of-run checks
  # verify (typed, delegation), and a flag here would be a change to a script
  # that runs as root on somebody else's box for a console that has nothing
  # to verify. Nothing in the core mentions this service: init-volumes, the
  # bus gates, the default `docker compose config` and the images install.sh
  # pulls are what they were without it. `finops-is-opt-in.sh` holds that.
  #
  # WHAT IT IS. The FinOps console: cloud and AI spend, a crew of agents that
  # triages it, and a person who reviews what they wrote. It enforces nothing
  # (no gateway, no refusal path) and, started as it is here, CANNOT SPEND:
  # no -gateway flag is passed, and the console's own words for that are
  # "empty means the console cannot spend at all". Letting its planning calls
  # go through this box's gateway is a spending decision, taken separately and
  # by the operator, and the crew runner (costcrew-run, the other binary in
  # the image) is not started here at all.
  #
  # TWO WIRINGS THAT FAIL SILENTLY WHEN WRONG, lifted from stack-k8s's
  # 49-costcrew.yaml, which learned them first:
  #
  #   The file name IS the integration. genaryx tails the bus directory and
  #   keys each source's read offset off the file STEM, so the stream has to be
  #   `costcrew.ndjson` and nothing else. The console's own default is empty,
  #   so one started by hand looks healthy and puts nothing on the bus.
  #
  #   The host has to be the trust domain the record plane is given. trailryx
  #   takes an event only if its agent id begins `agent://<domain>/`, matched
  #   against exactly ONE value, so the console takes RECORD_TRUST_DOMAIN, the
  #   variable record-seal reads, with the same deliberately-invalid default.
  #   A console minting under its own default would have every line it emits
  #   counted foreign by the seal, which reads as a quiet night.
  #
  # PASSPORTS AND OWNER ARE A PAIR. The console refuses to start with
  # -stack-passports and no -stack-owner (a passport with no owner is not a
  # valid document). This stack has no passports location of its own, so they
  # go inside the console's own data volume, and the owner is COSTCREW_OWNER
  # from .env, else the address alerts go to (ALERT_TO). With neither set the
  # console exits at start and says so; that is the failure staying inside the
  # service that was opted into, the way scopyx and typryx treat their keys
  # (`:-` and not `:?`, because compose interpolates every service, including
  # one whose profile is off). The notifier here mounts no passports directory,
  # so an alert about a CostCrew agent names the agent and not the owner.
  #
  # NO UI BEHIND CADDY. stack-caddy serves one site, the console, and its
  # Caddyfile is baked into that image in another repository, so a second site
  # would be a change to the core. The console is published on loopback only
  # and reached the way the main console is before a tunnel exists
  # (`ssh -L 8321:127.0.0.1:8321`). No -behind-tls for the same reason: nothing
  # terminates TLS in front of it, so this process sees the browser directly.
  #
  # ITS ACCOUNT. 10003:10003 is outside both bus uid families (10001, 65532),
  # outside the bus group and with no group_add, the shape agent-conform takes
  # at 10002: the bus directory is root:10001 2775, so this account can create
  # nothing there and can write exactly one file, the one costcrew-init made
  # and gave it. Its stream is 0644, readable by agent-conform through the
  # "other" bits (a stream it could not read would make the verifier exit and
  # restart on every box that enabled this).
  costcrew-init:
    profiles: ["finops"]
    image: busybox:1.36
    user: "0:0"
    command:
      - sh
      - -euc
      - |
        mkdir -p /vol/costcrew
        chown 10003:10003 /vol/costcrew && chmod 0750 /vol/costcrew
        [ -e /vol/events/costcrew.ndjson ] || : > /vol/events/costcrew.ndjson
        chown 10003:10003 /vol/events/costcrew.ndjson && chmod 0644 /vol/events/costcrew.ndjson
        echo "costcrew volumes ready"
    volumes:
      - events:/vol/events
      - costcrewdata:/vol/costcrew
    restart: "no"
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  costcrew:
    <<: *restart
    profiles: ["finops"]
    image: ${COSTCREW_IMAGE:-ghcr.io/taipanbox/costcrew:v0.4.0}
    user: "10003:10003"
    # The image's ENTRYPOINT is the console, so this is its argv.
    command:
      - -addr
      # The container's own address: the binary binds loopback by default,
      # which inside a container nothing else can reach, the published port
      # included. What reaches the host is decided by `ports:` below.
      - 0.0.0.0:8321
      - -data
      - /var/lib/costcrew
      - -stack-events
      - /var/lib/stack/events/costcrew.ndjson
      - -stack-passports
      - /var/lib/costcrew/passports
      - -stack-host
      - ${RECORD_TRUST_DOMAIN:-set-me.invalid}
      - -stack-owner
      - ${COSTCREW_OWNER:-${ALERT_TO:-}}
    ports:
      - "127.0.0.1:8321:8321"
    # A writable temp, because the root is read-only. SQLite writes a VACUUM's
    # working copy and a sort too big for memory to a temp file, and Go spools
    # a large upload to one; with no writable directory to put it in, SQLite
    # answers `disk I/O error (6410)` (no temp path). Measured 2026-10-08 on
    # the first start of v0.4.0 over a v0.3.0 volume: the session migration
    # dropped the clear-text tokens and then could not VACUUM them out of the
    # file's free pages, and said so as a WARNING. A tmpfs is memory, used only
    # while a temp file exists; at the size limit SQLite gets "database or disk
    # is full" for that one statement, not an outage. The seeded estate's
    # database is 3.4 MB, so 128m covers a VACUUM of a database many times
    # that. (CLAUDE.md invariant 24.)
    tmpfs:
      - /tmp:size=128m
    volumes:
      - events:/var/lib/stack/events
      - costcrewdata:/var/lib/costcrew
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      costcrew-init:
        condition: service_completed_successfully

volumes:
  # The shared event log the planes couple through. One machine, so this is
  # simply a volume: the cluster needed a ReadWriteMany class and a storage
  # provider to get the same thing.
  events:
  traces:
  cloudstate:
  consolestate:
  pgdata:
  # How far the notifier has read, and what it has already said. On a volume
  # because losing either means re-reading the log and re-sending alerts that
  # already went out, which on a restart loop is a mailbox full of one
  # incident.
  # scopyx's own journal, deliberately NOT the shared `events` volume above.
  scopyxevents:
  # typryx's own LEDGER only (answers.ndjson, outcomes.ndjson) since
  # 2026-09-26; its journal moved onto the shared `events` volume above, now
  # that agent-passport registers its four event types. The ledger is a
  # different kind of store, typryx's own answer/outcome record rather than
  # an agent-event stream, and stays here.
  typryxdata:
  # vouchryx's own revocation store (VOUCHRYX_REVOCATIONS_PATH), deliberately
  # not the shared `events` volume above: a revocation is not an agent event,
  # and it has to survive a plain `docker compose down` the way `pgdata` and
  # `wgstate` already do, so an operator clearing the bus never quietly
  # un-revokes a delegation.
  vouchryxdata:
  heraldyxstate:
  # The FinOps console's database, journal, signing key and passports (profile
  # finops). Named here and used by no service of the default set, so a box that
  # never enables the profile never creates it, and the default rendering of
  # this file does not list it.
  costcrewdata:
  # The chain verifier's memory (which breaks it has already announced), on its
  # own volume and not on the bus it walks: inside the bus directory it would be
  # read as a stream, and an operator clearing the bus would delete it and
  # re-send every alert.
  conformstate:
  # The record plane's store, deliberately NOT the shared `events` volume:
  # a hash-chained record kept inside the volume its own inputs live in is
  # evidence an operator can delete while clearing space on the bus.
  # focus-export's own output, so it never writes into the trace directory it
  # reads. Its artifact is the log line; the CSV is a convenience.
  focus:
  records:
  # The WireGuard server's own key. On a volume because regenerating it would
  # invalidate every device config ever issued, silently.
  wgstate:
  # Caddy's certificates and its ACME account key. On a volume because losing
  # them means re-issuing on every restart, and Let's Encrypt rate-limits that.
  caddydata:
  caddyconfig:
  # The UAPI socket the console manages peers through. This volume IS the
  # privilege boundary: the tunnel and NET_ADMIN live in the `wg` container,
  # and the console reaches them through one group-readable unix socket.
  wgapi:

networks:
  # Compose's own network, named so a service can be on it AND on another.
  default:
  # The typed risk signal's one door, and the reason the proxy can run open.
  # `typryx wardryx-proxy` asks the typed backend about every tool call it
  # forwards, so anything that can reach it can spend this box's ask budget,
  # and the only caller that cannot present a credential to it is tokenfuse's
  # MCP broker (it has no way to add the header). So the proxy runs without
  # `TYPRYX_KEYS` and its only protection is who can reach it: this network
  # holds the proxy, the broker, and wardryx (the proxy's upstream), and the
  # proxy is on no other network and publishes no port. Only a service listed
  # here can address it, and `typed-risk-signal.sh` holds that list.
  risk-signal:
